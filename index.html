<!DOCTYPE html>
<html lang="zh-Hant">
<!--
肉鴿召回 Rogue Recall ── 第一版（P1 單人、極簡）
固定 1920×1080，視窗較小時等比縮放，不產生捲軸。
操作：空白鍵 / Enter = 開始戰鬥・下一層・重新開始　P = 暫停　X = 切換 1x/3x　L = 隱藏日誌　1 2 3 = 切換分頁　Z = 全螢幕
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肉鴿召回 Rogue Recall</title>
<style>
  /* ⚠ 設計規則：不要做「閃一下」的效果（瞬間亮起又消失、閃爍、白光爆閃）。使用者覺得非常刺眼。
     出現／消失一律用柔和的淡入淡出（建議 0.6 秒以上），不要用短促的閃光動畫。 */
  :root {
    --bg:#0c0c10; --panel:#15151b; --panel2:#1b1c24; --line:#2c2d38; --line2:#3a3c4a;
    --ink:#e9e6dc; --muted:#8a8794; --gold:#e8b44a; --red:#d8363a; --red2:#7a1a1e; --blue:#3a78d8; --grey:#8d8d96;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; }
  canvas { image-rendering:pixelated; display:block; }
  button { font-family:inherit; }
  .ol { text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000; }

  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg);
    display:grid; grid-template-columns:739px 400px 739px; column-gap:13px; padding:8px; overflow:hidden; }
  .col { display:flex; flex-direction:column; gap:10px; height:1064px; min-height:0; }

  /* ===== 樸素面板（左上、右側） ===== */
  .plain { background:var(--panel); border:2px solid var(--line); padding:12px 14px; overflow:hidden; }
  .plain h3 { margin:0 0 10px; font-size:24px; font-weight:700; letter-spacing:2px; display:flex; align-items:center; gap:14px; }
  .plain h3 small { margin-left:auto; font-size:13px; color:var(--muted); font-weight:400; letter-spacing:0; }
  .pgrid { display:grid; gap:6px; }
  .pcell { background:#1d1e26; border:1px solid #262733; }
  .pcell.on { background:#2c6e2c; border-color:#3f9a3f; }
  .lockrow { height:58px; display:flex; align-items:center; justify-content:center; color:#5d5b66; font-size:16px; border-top:1px dashed #23242e; }

  #equip { height:630px; flex:0 0 630px; }
  #equip .pgrid { grid-template-columns:repeat(8,1fr); grid-auto-rows:56px; }

  /* ===== 左下：角色面板（重點） ===== */
  .pp { height:527px; flex:0 0 527px; background:var(--panel); border:2px solid var(--line); display:flex; flex-direction:column; position:relative; padding:0 8px; overflow:hidden; }
  .pphead { height:46px; flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 8px; border-bottom:1px solid #23242e; font-size:20px; }
  .pphead b { color:var(--gold); font-size:20px; } .pphead em { margin-left:auto; font-style:normal; color:var(--muted); font-size:18px; }
  .ghost .pphead span { color:#5d5b66; }
  .ghost .slots { opacity:.55; }
  .ghost .tabs { opacity:.45; pointer-events:none; }
  .ghost .bars { opacity:.45; }
  .ghost .wait { margin-top:auto; margin-bottom:22px; text-align:center; color:#5d5b66; font-size:20px; letter-spacing:4px; }
  /* 未加入的位置：整塊蓋住，用跟 P1 底板同色的暗面，只留細框與一個很淡的編號 */
  .pp.ghost > * { visibility:hidden; }
  .pp.ghost { background:
      radial-gradient(ellipse at 50% 46%, #1a1a22 0%, #15151b 55%, #101015 100%); }
  .pp.ghost::before { content:''; position:absolute; inset:10px; pointer-events:none;
    border:1px solid #20212b;
    background:
      linear-gradient(#2c2d38,#2c2d38) 0 0/16px 1px no-repeat, linear-gradient(#2c2d38,#2c2d38) 0 0/1px 16px no-repeat,
      linear-gradient(#2c2d38,#2c2d38) 100% 0/16px 1px no-repeat, linear-gradient(#2c2d38,#2c2d38) 100% 0/1px 16px no-repeat,
      linear-gradient(#2c2d38,#2c2d38) 0 100%/16px 1px no-repeat, linear-gradient(#2c2d38,#2c2d38) 0 100%/1px 16px no-repeat,
      linear-gradient(#2c2d38,#2c2d38) 100% 100%/16px 1px no-repeat, linear-gradient(#2c2d38,#2c2d38) 100% 100%/1px 16px no-repeat; }
  .pp.ghost::after { position:absolute; left:0; right:0; top:50%; transform:translateY(-52%); text-align:center; pointer-events:none;
    font-size:210px; font-weight:900; line-height:1; color:transparent; -webkit-text-stroke:2px #20212b; letter-spacing:0; }
  #pp2.ghost::after { content:'2'; } #pp3.ghost::after { content:'3'; } #pp4.ghost::after { content:'4'; }
  /* 觀察員（第 1 場～羊會長出現前，坐在 P2～P4 的蓋板上） */
  .pp.ghost.obs::after { display:none; }
  .pp.ghost > .obsBox { visibility:visible; }
  .obsBox { position:absolute; inset:10px; display:flex; flex-direction:column; padding:14px 22px 16px; transition:opacity .9s; z-index:3; }
  .obsBox.bye { opacity:0; }
  .obTop { height:44px; flex:0 0 44px; display:flex; align-items:center; gap:14px; }
  .obTop .obRole { font-size:15px; letter-spacing:3px; color:#5d5b66; border:1px solid #2c2d38; padding:3px 8px; }
  .obTop b { font-size:22px; letter-spacing:3px; color:#b8b4c4; font-weight:700; }
  .obLeave { margin-left:auto; background:#0e0f14; border:1px solid #3a3c48; color:#8a8794; font-size:15px; letter-spacing:2px; padding:7px 14px; cursor:pointer; font-family:inherit; }
  .obLeave:hover { border-color:#c9a050; color:#f0cc50; } .obLeave:disabled { opacity:.35; cursor:default; border-color:#3a3c48; color:#8a8794; }
  .obMain { flex:1; display:flex; gap:26px; align-items:center; min-height:0; }
  #pp3 .obMain, #pp4 .obMain { flex-direction:row-reverse; }
  .obFace { width:168px; height:168px; flex:0 0 168px; position:relative; border:2px solid #2c2d38; background:#0b0b0f; }
  .obFace canvas { width:100%; height:100%; }
  .obFace::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, transparent 1px 14px), repeating-linear-gradient(0deg, rgba(0,0,0,.45) 0 1px, transparent 1px 14px); }
  .obSay { flex:1; height:210px; display:flex; align-items:center; font-size:27px; line-height:1.55; letter-spacing:1px; color:#d8d4e2; position:relative; padding:0 22px; border-left:2px solid #2c2d38; overflow:hidden; }
  #pp3 .obSay, #pp4 .obSay { border-left:0; border-right:2px solid #2c2d38; }
  .obSay span { opacity:0; transform:translateY(6px); transition:opacity .3s, transform .3s; }
  .obSay span.in { opacity:1; transform:none; }
  .obHist { height:84px; flex:0 0 84px; border-top:1px solid #20212b; padding-top:8px; display:flex; flex-direction:column; gap:4px; overflow:hidden; }
  .obHist div { font-size:16px; color:#4e4c58; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px; }
  .obsBox.s-strict .obSay { color:#e6c9c4; } .obsBox.s-data .obSay { color:#9fe0b8; font-family:Consolas,"Microsoft JhengHei",monospace; } .obsBox.s-kind .obSay { color:#ecdcb8; }
  .mateSay { position:absolute; z-index:40; max-width:520px; padding:12px 20px; background:#0e0f14; border:2px solid #4a4c5a; color:#e9e6dc; font-size:26px; line-height:1.45; letter-spacing:1px; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .3s, transform .3s; }
  .mateSay.in { opacity:1; transform:none; }
  .mateSay::before { content:''; position:absolute; left:22px; top:-10px; border:8px solid transparent; border-top:0; border-bottom-color:#4a4c5a; }
  .mateSay.lose { border-color:#6a3a3a; color:#d8c8c4; } .mateSay.lose::before { border-bottom-color:#6a3a3a; }
  .orn { height:18px; position:relative; margin:4px 18px 0; }
  .orn::before { content:''; position:absolute; left:10px; right:10px; top:8px; height:1px; background:linear-gradient(90deg,#3d3a30,#6a5f44 50%,#3d3a30); }
  .orn i { position:absolute; top:4px; width:9px; height:9px; transform:rotate(45deg); border:1px solid #6a5f44; background:#1a1810; }
  .orn i:first-child { left:2px; } .orn i:last-child { right:2px; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; height:46px; margin:4px 10px 0; }
  .tab { background:#14151b; border:none; color:#6e6c78; font-size:20px; font-weight:700; letter-spacing:2px; cursor:pointer; position:relative; }
  .tab.on { color:var(--ink); background:transparent; }
  .tab.on::after { content:''; position:absolute; left:6px; right:6px; bottom:2px; height:3px; background:var(--gold); }
  .tabBody { height:460px; margin:8px 4px 0; overflow:hidden; position:relative; }
  .slots { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 14px; }
  .slot { height:106px; border-radius:12px; position:relative;
    background:linear-gradient(160deg,#2a2c38 0%,#1e1f29 55%,#191a22 100%);
    box-shadow:inset 0 2px 0 #353746, inset 0 -3px 0 #101117, 0 3px 0 #08080b; }
  .slot::after { content:''; position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; transform:rotate(45deg);
    background:#252632; box-shadow:0 0 0 1px #2f3140; }
  .slot.has::after { display:none; }
  .slot canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:auto; }
  .slot .key { position:absolute; left:8px; top:5px; font-size:17px; font-weight:900; color:#8d8a98; letter-spacing:1px; z-index:1; }
  .slot .cost { position:absolute; right:8px; top:5px; min-width:22px; height:22px; border-radius:11px; background:#1d4f9a; color:#fff; font-size:15px; font-weight:900; display:flex; align-items:center; justify-content:center; z-index:1; }
  .slot.card { cursor:pointer; } .slot.card:hover { box-shadow:inset 0 0 0 2px #c9a050, 0 3px 0 #08080b; }
  .slot.off canvas { opacity:.35; } .slot.off .cost { background:#6b2a2a; }
  .slot.play { animation:cplay .28s ease-out; }
  @keyframes cplay { 0%{ transform:scale(1); } 40%{ transform:scale(.93); box-shadow:inset 0 0 0 3px #f0cc50; } 100%{ transform:scale(1); } }
  .slot .cnt { position:absolute; right:10px; bottom:6px; font-size:18px; font-weight:700; }
  .crew { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 14px; }
  .crew .slot { height:192px; cursor:pointer; display:flex; flex-direction:column; align-items:center; padding-top:10px; }
  .crew .slot::after { display:none; }
  .crew .slot.me { box-shadow:inset 0 0 0 2px #7a6a44, inset 0 2px 0 #353746, 0 3px 0 #08080b; }
  .crew .slot.sel { box-shadow:inset 0 0 0 3px var(--gold), 0 3px 0 #08080b; }
  .crew .pick { width:34px; height:34px; border:2px solid #cfc7b0; flex:0 0 34px; visibility:hidden; font-size:15px; font-weight:700; line-height:30px; text-align:center; color:#fff; text-shadow:0 1px 2px #000,0 0 3px #000; }
  .crew .pick.show { visibility:visible; }
  .slot.solo { background:#14151b; box-shadow:none; height:224px; margin:0 6px; display:flex; flex-direction:column; align-items:center; padding-top:12px; }
  .slot.solo::after { display:none; }
  .slot.solo .pick { width:34px; height:34px; flex:0 0 34px; visibility:hidden; }
  .slot.solo .fig { height:120px; flex:0 0 120px; margin-top:10px; display:flex; align-items:flex-end; justify-content:center; }
  .slot.solo .fig canvas { position:static; transform:none; width:100px; }
  .slot.solo .nm { margin-top:12px; font-size:22px; font-weight:700; }
  .crew .fig { height:72px; flex:0 0 72px; margin-top:8px; display:flex; align-items:flex-end; justify-content:center; }
  .crew .fig canvas { position:static; transform:none; width:60px; }
  .crew .tg { margin-top:10px; font-size:15px; color:var(--muted); font-weight:700; }
  .crew .nm { margin-top:2px; font-size:20px; font-weight:700; }
  .crewHint { margin-top:14px; text-align:center; font-size:18px; color:#7d7a86; letter-spacing:3px; height:24px; }
  .attr { display:grid; grid-template-columns:1fr auto; row-gap:3px; column-gap:20px; padding:4px 18px; font-size:19px; }
  .attr span:nth-child(even) { text-align:right; font-variant-numeric:tabular-nums; }

  .bars { margin:8px 6px 0; padding:6px 8px; background:#101016; border:2px solid #3a3b47; box-shadow:inset 0 0 0 2px #050507; position:relative; height:104px; }
  .bar { position:relative; background:#202128; border:2px solid #0a0a0d; }
  .bar i { position:absolute; left:0; top:0; bottom:0; transition:width .18s; }
  .bar .v { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
  .bar .v.ol { text-shadow:none; -webkit-text-stroke:3px #000; paint-order:stroke fill; }   /* 數字外框用描邊，不用 8 方向陰影（會有階梯狀破碎感） */
  .bar .lab { position:absolute; left:71%; top:50%; transform:translate(-50%,-52%); font-weight:var(--lab-w,900); font-family:var(--lab-f,inherit); font-size:var(--lab-s,20px); letter-spacing:var(--lab-ls,12px); white-space:nowrap;
    text-shadow:none; -webkit-text-stroke:calc(var(--lab-ol,1.4px) * 2) #000; paint-order:stroke fill; }
  #bHp { height:26px; } #bHp i { background:linear-gradient(#ff4a46,#d8282c 60%,#b01a20); } #bHp .v { font-size:18px; left:-70px; }
      #bBlock { height:26px; margin-top:4px; } #bBlock i { background:linear-gradient(#a2a3ad,#7c7d88); } #bBlock .v { font-size:17px; left:-70px; }
      #bExp { height:26px; margin-top:4px; } #bExp i { background:linear-gradient(#b89c58,#8f7638 60%,#7a6430); } #bExp .v { font-size:16px; left:-70px; }
      .bars.hurt, .statrow.hurt { animation:shake .3s; }
  @keyframes shake { 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(2px)} }
  .icons { height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; margin-top:6px; font-size:21px; font-weight:900; }
  .icons .g { display:flex; align-items:center; gap:12px; }
  .icons span { display:flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums; position:relative; }
  .icons canvas { width:26px; height:26px; }
  .icons .dim { opacity:.3; }
  .icons .d { width:32px; height:32px; justify-content:center; border:2px solid #3a2a2c; background:#14151b; }
  .icons .d.empty { border:2px dashed #2a2b34; }
  .icons .d.on { border-color:#9a3a3a; }
  .icons .d.empty canvas { opacity:.3; }
  .icons .d i { position:absolute; right:-2px; bottom:-4px; font-style:normal; font-size:15px; }

  /* ===== 中央：地城 ===== */
  #view { flex:1 1 auto; min-height:0; position:relative; border:3px solid #2e3038; box-shadow:inset 0 0 0 2px #000; overflow:hidden; background:#0a0705; }
  #dungeon { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  .topbtns { position:absolute; left:8px; right:8px; top:8px; display:flex; justify-content:space-between; align-items:center; gap:5px; z-index:5; }
  .tb { height:44px; min-width:44px; padding:0 10px; background:#121318; color:var(--ink); border:2px solid #474a58; border-radius:8px;
    font-size:22px; font-weight:900; cursor:pointer; box-shadow:inset 0 -3px 0 #07070a; }
  .tb.tag { cursor:default; display:flex; align-items:center; color:#f0cc50; }
  .pp.down { filter:grayscale(1) brightness(.72); }
  .pp.down::after { content:'重度昏厥…'; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-size:46px; font-weight:900; letter-spacing:6px; color:#e9e6dc; text-shadow:0 3px 0 #000, 0 0 16px #000; background:rgba(6,6,10,.78); padding:14px 0; z-index:20; pointer-events:none; }
  #charPanel.down .hgrid { opacity:.4; }
  .pp.myturn { border-color:#4fbf6a; box-shadow:0 0 0 2px #4fbf6a, 0 0 18px rgba(80,200,110,.35); }
  #pp2 .slot.solo { margin:0 6px; }
  #pp2 .slot canvas, #pp2 .slot img.cico { width:60px; height:60px; }
  #pp2 .bar .v { left:-70px; font-size:17px; }
  #pp2 .bar.bh i { background:linear-gradient(#ff4a46,#d8282c 60%,#b01a20); }
  #pp2 .bar.bs i { background:linear-gradient(#a2a3ad,#7c7d88); }
  #pp2 .bar.be i { background:linear-gradient(#b89c58,#8f7638 60%,#7a6430); }
  #pp2 .p2note { margin-top:auto; margin-bottom:18px; text-align:center; color:#8d8a98; font-size:19px; letter-spacing:3px; }
  #pp2.down .slots, #pp2.down .bars { opacity:.4; } #pp2.down .p2note { color:#ff8a7a; }
  #pp2.join { animation:pjoin 1.4s ease-out; }
  .pp.ghost.xf { position:absolute; inset:-2px; height:auto; z-index:30; pointer-events:none; animation:xfOut 1s ease forwards; }
  .pp.ghost.xf::after { content:'2'; }
  @keyframes xfOut { from { opacity:1; } to { opacity:0; } }
  #pp2.xin > :not(.xf) { animation:xfIn 1s ease; }
  @keyframes xfIn { from { opacity:0; } to { opacity:1; } }
  @keyframes pjoin { 0% { box-shadow:0 0 0 3px #f0cc50, 0 0 40px rgba(240,204,80,.8); } 100% { box-shadow:none; } }
  .c-p2 { color:#e8c84a; }
  .tg { display:flex; gap:4px; }
  .tg i { font-style:normal; font-size:15px; font-weight:900; color:#111; padding:1px 5px; border:2px solid #000; border-radius:4px; -webkit-text-stroke:0; }
  #ordTag { display:none; width:196px; gap:5px; padding:0 5px !important; justify-content:flex-start !important; } #ordTag.on { display:flex; }   /* 固定寬度：預留 4 人＋敵人 5 格 */
  #ordTag .ot { width:32px; height:28px; flex:0 0 32px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:#d8d4e2; border:2px solid #2c2d38; border-radius:4px; background:#0e0f14; margin:0 !important; transition:border-color .6s ease, opacity .6s ease, box-shadow .6s ease; }
  #ordTag .ot.cur { border-color:#4fbf6a; box-shadow:0 0 8px rgba(80,200,110,.35); }
  #ordTag .ot.done { opacity:.35; }
  #ordTag .ot.foe.cur { border-color:#9a2a2a; box-shadow:0 0 8px rgba(150,30,30,.4); }
  #ordTag .ot canvas { width:22px; height:20px; image-rendering:pixelated; }
  #charPanel.myturn { border-color:#4fbf6a; box-shadow:0 0 0 2px #4fbf6a, 0 0 18px rgba(80,200,110,.35); }   /* 輪到的玩家：綠色外框 */
  #loseLayer { position:absolute; inset:0; z-index:7; background:rgba(8,6,6,.72); display:none; flex-direction:column; align-items:center; justify-content:center; gap:34px; }
  #loseLayer.show { display:flex; }
  #loseLayer b { font-size:64px; font-weight:900; letter-spacing:10px; color:#d84a44; }
  #loseLayer button { height:66px; padding:0 34px; background:#121318; border:3px solid #4a4c5a; border-radius:8px; color:var(--ink); font-size:34px; font-weight:900; letter-spacing:4px; cursor:pointer; }
  #loseLayer button:hover { border-color:#c9a050; }
  .topbtns .tb { height:38px; min-width:38px; padding:0 8px; font-size:19px; justify-content:center; box-sizing:border-box; } #floor, #bLog { width:76px; padding:0; display:flex; align-items:center; justify-content:center; }
  .tb.on { border-color:var(--gold); color:var(--gold); }
  #monWrap { position:absolute; left:0; right:0; top:330px; display:flex; justify-content:center; }
  #monster { width:364px; height:auto; transform-origin:50% 100%; }
  #monster.hit { animation:mhit .2s ease-out; }
  @keyframes mhit { 0%{filter:brightness(.45) saturate(1.8);transform:translateX(-8px)} 50%{filter:brightness(.7) saturate(1.5);transform:translateX(8px)} 100%{filter:none;transform:none} }
  #monster.dead { animation:mdie .9s forwards; }
  @keyframes mdie { to { opacity:0; filter:brightness(.3) saturate(2); transform:translateY(30px) scaleY(.6); } }
  #monster.idle { animation:breath 2.4s ease-in-out infinite; }
  @keyframes breath { 50% { transform:translateY(-5px); } }
  #view.multi #monWrap, #view.multi #monIntent, #view.multi #monFx, #view.multi #monName, #view.multi #monBars { display:none; }
  #enemies { position:absolute; inset:0; z-index:2; pointer-events:none; }
  .en { position:absolute; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; pointer-events:auto; cursor:pointer; }
  .en.dead { pointer-events:none; }

function hideMon() { ['monWrap', 'monIntent', 'monFx', 'monName', 'monBars', 'enemies'].forEach(id => $(id).style.visibility = 'hidden'); }
function M_show() { ['monWrap', 'monIntent', 'monFx', 'monName', 'monBars', 'enemies'].forEach(id => $(id).style.visibility = ''); }
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  let bob = 0;
  if (state === 'walk' && walk) {
    const sp = walk.sp, d = paused ? 0 : dt * speed;
    const ease = Math.min(1, walk.d / .5 + .25, (sp.total - walk.d) / .7 + .12);
    walk.d = Math.min(sp.total, walk.d + WALK_V * d * ease);
    const p = samplePath(sp, walk.d), q = samplePath(sp, walk.d + .85);
    cam.x = p[0]; cam.y = p[1];
    if (Math.hypot(q[0] - p[0], q[1] - p[1]) > .01) {
      const target = Math.atan2(q[1] - p[1], q[0] - p[0]);
      let dy = target - cam.yaw; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
      cam.yaw += dy * Math.min(1, d * 9);
    }
    bob = Math.sin(walk.d * 7.5) * 1.4;
    if (walk.d >= sp.total - .001) arrive();
  }
  drawDungeon2D(now, 0);
  requestAnimationFrame(loop);
}

function npcReplace(a, id) {   // 換掉最弱的一張（輕攻擊優先），非手牌優先
  const order = ['blank', 'light', 'mid', 'heavy'], old = order.find(k => k !== id && a.cards.includes(k)) || a.cards.find(k => k !== id);
  if (!old) { a.cards.push(id); a.draw.push(id); return null; }
  a.cards[a.cards.indexOf(old)] = id;
  const di = a.draw.indexOf(old), ci = a.disc.indexOf(old), hi = a.hand.indexOf(old);
  if (di >= 0) a.draw[di] = id; else if (ci >= 0) a.disc[ci] = id; else if (hi >= 0) a.hand[hi] = id;
  return old;
}
