<!DOCTYPE html>
<html lang="zh-Hant">
<!--
【固定版面維護要求｜使用者明確指定，後續修改必須遵守】
1. 電腦版與手機版的 UI 視窗須預先保留足夠空間，尺寸固定。
   不得因文字長短、題目切換、戰報、Log 更新或遊戲階段變化，造成縮小、放大、位移或重新排版。
   寧可一開始面板較大、短內容留白，也不要隨內容收縮。
2. 電腦版驗收基準：1920×1080、全螢幕、瀏覽器縮放100%。
   必須在同一畫面看見全部遊戲內容與操作介面，不需要捲動或縮小瀏覽器比例。
   不得僅隱藏捲動條、裁切或遮住內容來宣稱達標；必須實際檢查面板與內容完整可見。
3. 手機版另設固定版面，避免內容更新造成面板高度或角色位置跳動。
4. Log：電腦版位於右側直欄（題目卡下方），固定13行；手機顯示4行、可在Log內上下滑動最多看8行，新紀錄自動回到最上方。無翻頁按鈕，只保留最新紀錄。
5. 題目與戰報不提供上一頁／下一頁。長文應先規劃足夠的固定空間及語意斷行。
6. 每次涉及文字、面板尺寸、字級或布局修改，都要回查以上要求。
   若尚未完成實際畫面驗收，須明確說明，不得把語法或邏輯檢查當成版面驗收。
7. 版本：預設為無頭銜版；1 秒內連按 3 次 P2 是「頭銜版」開關：無頭銜→有頭銜、有頭銜→無頭銜，每次切換都整個重新開始（網址後綴 #titled 代表有頭銜版）。
這是持續有效的設計約束，無須使用者重複提醒；除非使用者明確更改要求。
-->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>遠征 - 亂世荒野求生</title>
<style>
  :root {
    --bg: #2b241b;
    --panel: #3a3026;
    --ink: #e6d8bc;
    --muted: #ad9975;
    --btn: #8b6f47;
    --btn-hover: #a3865c;
    --hp: #b5604a;
    --heal: #7fa37a;
    --hunger: #c9a050;
    --line: #5a4a36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  canvas { image-rendering: pixelated; display: block; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: 64px 16px 24px;
    display: flex;
    justify-content: center;
  }

  .scene {
    width: 100%;
    max-width: 1140px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 900px) {
    .scene { grid-template-columns: 1.75fr 1fr; align-items: start; }
  }

  /* 開局右上角提示（開始遊玩後自動隱藏） */
  .corner-hint {
    position: fixed;
    right: 16px;
    top: 14px;
    z-index: 25;
    background: var(--panel);
    border: 1px solid var(--hunger);
    color: var(--ink);
    padding: 6px 12px;
    font-size: 12.5px;
    line-height: 1.4;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    transition: opacity .3s;
  }
  .corner-hint.hide {
    opacity: 0;
    pointer-events: none;
    display: none;
  }

  /* ---------- 左：營火與 6 人隊伍 ---------- */
  .camp { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .fire { padding-top: 2px; }
  .fire-wrap { position: relative; display: flex; justify-content: center; min-height: 74px; }

  /* 窗簾（外出中） */
  .curtain {
    position: absolute; inset: 0; z-index: 6;
    background: repeating-linear-gradient(90deg, #4a2f20 0 14px, #3a2418 14px 16px);
    border: 2px solid #2a1a10;
    transform: translateY(-101%);
    transition: transform 1.05s ease-in-out;
    display: flex; align-items: center; justify-content: center;
  }
  .curtain::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
    background: repeating-linear-gradient(90deg, var(--hunger) 0 6px, transparent 6px 12px);
  }
  .curtain.drop { transform: translateY(0); }
  .curtain-clip { position: absolute; inset: 0; clip-path: inset(0 -8px -12px -8px); z-index: 6; pointer-events: none; }
  .curtain span {
    color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    opacity: 0; transition: opacity .25s; text-align: center; padding: 0 4px;
  }
  .curtain.shown span { opacity: 1; }

  .flyer { position: fixed; pointer-events: none; z-index: 25; }
  .pool { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; z-index: 14; }
  .pool canvas { position: absolute; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.3); }
    to   { opacity: 1; transform: none; }
  }

  .dayLabel {
    position: fixed; left: 20px; top: 14px; z-index: 15;
    font-size: 24px; font-weight: 700; color: var(--hunger);
    letter-spacing: 2px; pointer-events: none;
  }
  .daySub {
    font-size: 13px; color: var(--muted); margin-left: 10px; font-weight: 400; letter-spacing: 0.5px;
  }
  .countdown {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px; font-weight: 700; color: #f2e6cc;
    text-shadow: 0 3px 0 #1e1811, 3px 0 0 #1e1811, -3px 0 0 #1e1811, 0 -3px 0 #1e1811;
    opacity: 0; pointer-events: none; z-index: 12;
    transition: opacity .2s;
  }
  .countdown.show { opacity: 1; }

  /* 電腦版：左到右一字排開（1x6） */
  .party {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    width: 100%;
    position: relative;
    padding: 46px 2px 10px;
  }
  .slot {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 20px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: opacity .3s;
    user-select: none;
    cursor: pointer;
    min-width: 0;
  }
  .slot.me { border-color: var(--ink); }
  .slot.selected { outline: 3px solid var(--hunger); outline-offset: 2px; box-shadow: 0 0 0 2px var(--bg); }
  .slot.hover { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .slot.dead { opacity: .35; filter: grayscale(.88); pointer-events: none; }
  .tag {
    position: absolute; top: 4px; left: 6px;
    font-size: 11px; font-weight: 700; color: var(--muted);
  }
  .weapon-badge {
    position: absolute; top: 3px; right: 5px;
    display: flex; align-items: center; gap: 2px;
  }
  #eatIcons canvas { cursor: pointer; opacity: .3; transition: opacity .15s, transform .15s; }
  #eatIcons canvas.on { opacity: 1; }
  #eatIcons canvas:hover { transform: translateY(-3px); }
  .cname {
    font-size: 12px; font-weight: 700; color: var(--ink);
    min-height: 16px; line-height: 16px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
  }
  .figure { height: 60px; display: flex; align-items: flex-end; justify-content: center; }
  .figure canvas { width: 45px; height: auto; }
  .stats-line { display: flex; flex-direction: column; gap: 3px; width: 100%; font-size: 11.5px; }
  .stat { display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
  .stat .val { margin-left: auto; }
  .stat .lab { color: var(--muted); white-space: nowrap; }
  .stat .val.warn { color: var(--hp); font-weight: 700; }
  .stat .val.gear-txt { color: #e8c26a; font-weight: 700; }
  .stat .val.shield-txt { color: #8ec0e4; font-weight: 700; }

  /* 投票色塊（頭上方） */
  .pick {
    position: absolute; top: -42px; left: 50%; z-index: 7;
    width: 36px; height: 36px;
    transform: translateX(-50%);
    border: 2px solid var(--ink);
    display: none;
    font-size: 12px; font-weight: 700; line-height: 32px;
    color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000;
    text-align: center; overflow: hidden;
  }
  .pick.show { display: block; }

  /* 計票數字（角色頭頂） */
  .tally {
    position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 700; color: var(--hunger); white-space: nowrap;
    background: rgba(30,24,17,.88); padding: 0 5px; border-radius: 2px;
    opacity: 0; transition: opacity .25s; z-index: 4;
  }
  .tally.show { opacity: 1; }

  /* 平手抽牌 */
  .dcard {
    position: fixed; z-index: 30; width: 28px; height: 36px;
    border: 2px solid var(--ink); background: var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }

  .slot.win { border-color: var(--hunger); box-shadow: 0 0 0 3px var(--hunger); }
  .slot.tie { animation: tieFlash .38s ease-in-out 3; }
  @keyframes tieFlash {
    50% { border-color: var(--hunger); box-shadow: 0 0 0 3px var(--hunger); }
  }

  .expedBtn {
    width: 100%; max-width: 420px; padding: 12px 10px; border: none; cursor: pointer;
    background: var(--btn); color: var(--bg); font-size: 16px; font-family: inherit; font-weight: 700;
    letter-spacing: 0.5px;
  }
  .expedBtn:hover:not(:disabled) { background: var(--btn-hover); }
  .expedBtn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- 右：卡牌（統一顯示題目與戰報）與紀錄 ---------- */
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .deck-slot {
    background: var(--panel);
    border: 1px dashed var(--line);
    min-height: 165px;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .deck-slot .empty { color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .card {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--ink);
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.7;
    animation: slideIn .38s ease-out;
    white-space: pre-line;
  }
  .story-text { word-break: normal; line-break: strict; overflow-wrap: normal; text-wrap: pretty; }
  .text-unit { display: inline-block; max-width: 100%; white-space: normal; vertical-align: top; }
  .card.report {
    border-color: var(--hunger);
  }
  @keyframes slideIn {
    from { transform: translateX(36px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .log {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 12px;
    font-size: 13px;
    min-height: 220px;
    max-height: 310px;
    overflow-y: auto;
    color: var(--muted);
    line-height: 1.6;
  }
  .log p { margin: 0 0 5px 0; }
  .log p:first-child { color: var(--ink); }

  /* 進食與投票確認視窗（固定於畫面下方，不遮擋角色格） */
  .modal {
    position: fixed; inset: 0;
    background: none;
    pointer-events: none;
    display: none; align-items: flex-end; justify-content: center;
    padding-bottom: 3.5vh;
    z-index: 20;
  }
  .modal.show { display: flex; }
  .modal-box {
    pointer-events: auto;
    background: var(--panel);
    border: 2px solid var(--ink);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 280px;
    max-width: 92vw;
    text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.75);
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1; padding: 9px 10px; border: none; cursor: pointer;
    background: var(--btn); color: var(--bg); font-family: inherit; font-size: 15px; font-weight: 700;
  }
  .modal-actions button:hover { background: var(--btn-hover); }
  .modal-actions button.ghost { background: var(--line); color: var(--ink); }
  .modal-actions button.alt-choice { background: #4f6b8a; color: #f2e6cc; }
  .modal-actions button.alt-choice:hover { background: #6382a6; }

  /* 結局彈窗 */
  .demo {
    position: fixed; inset: 0;
    background: rgba(20,15,10,.88);
    display: none; align-items: center; justify-content: center;
    z-index: 50;
  }
  .demo.show { display: flex; }

  /* =====================================================================
     手機全螢幕模式（1秒內連按3次「你」切換）
     題目在最上方，6名角色改為「上三下三（3x2）」，火堆與 Log 移至最下方
     ===================================================================== */
  body.mobile-mode {
    padding: max(10px, env(safe-area-inset-top, 0px)) 8px 10px;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  body.mobile-mode .dayLabel {
    position: static;
    font-size: 17px;
    text-align: left;
    width: 100%;
    max-width: 412px;
    margin-bottom: 4px;
    padding: 2px 0;
    border-bottom: 1px solid var(--line);
  }
  body.mobile-mode .daySub {
    display: block;
    font-size: 11px;
    margin-left: 0;
    margin-top: 1px;
  }
  body.mobile-mode .scene {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 412px;
    width: 100%;
  }
  body.mobile-mode .camp,
  body.mobile-mode .side {
    display: contents;
  }
  /* 1. 題目／戰報卡在最上方 */
  body.mobile-mode .deck-slot {
    order: 1;
    min-height: 96px;
    padding: 6px 8px;
  }
  body.mobile-mode .card {
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.5;
  }
  /* 2. 6名角色改為「上三下三（3x2）」緊接在題目下方 */
  body.mobile-mode .party {
    order: 2;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px 6px;
    padding: 32px 0 4px;
  }
  body.mobile-mode .slot {
    padding: 15px 5px 5px;
    gap: 3px;
    border-width: 1.5px;
  }
  body.mobile-mode .tag { font-size: 10px; top: 2px; left: 4px; }
  body.mobile-mode .weapon-badge { top: 2px; right: 3px; transform: scale(0.9); transform-origin: top right; }
  body.mobile-mode .figure { height: 42px; }
  body.mobile-mode .figure canvas { width: 34px; height: auto; }
  body.mobile-mode .cname { font-size: 11px; min-height: 14px; line-height: 14px; }
  body.mobile-mode .stats-line { font-size: 10.5px; gap: 2px; }
  body.mobile-mode .pick {
    top: -28px;
    width: 30px;
    height: 26px;
    font-size: 10.5px;
    line-height: 22px;
    border-width: 1.5px;
  }
  body.mobile-mode .tally {
    font-size: 11px;
    top: 3px;
    padding: 0 4px;
  }
  /* 3. 主按鈕在角色下方，方便單手拇指點擊 */
  body.mobile-mode .expedBtn {
    order: 3;
    max-width: 100%;
    padding: 10px 0;
    font-size: 15px;
  }
  /* 4. 火堆與飛行道具池移至下方 */
  body.mobile-mode .fire-wrap {
    order: 4;
    min-height: 46px;
    margin: 2px 0;
  }
  body.mobile-mode #fireCanvas {
    width: 80px;
    height: auto;
  }
  body.mobile-mode .countdown { font-size: 36px; }
  /* 5. 遊戲紀錄 Log 移至最底部 */
  body.mobile-mode .log {
    order: 5;
    min-height: 105px;
    max-height: 140px;
    font-size: 11.5px;
    padding: 6px 8px;
  }
  body.mobile-mode .modal {
    padding-bottom: 2vh;
  }
  body.mobile-mode .modal-box {
    width: 95vw;
    padding: 12px 14px;
  }

  html { min-height: 100%; scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body { overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
  body { min-height: 100dvh; height: auto; }
  .scene { max-height: none; }
  .side { min-height: 0; }
  .deck-slot { flex-direction: column; align-items: stretch; min-height: 0; flex-shrink: 0; }
  .card { animation: none; }
  .log { min-height: 0; max-height: none; overflow: hidden; flex-shrink: 0; }
  .log-content { height: calc(8 * 1.6em); overflow: hidden; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; font-size: 12px; }
  .pager[hidden] { display: none; }
  .pager button { background: var(--line); color: var(--ink); border: 1px solid var(--muted); padding: 5px 9px; font: inherit; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  body.mobile-mode .log { min-height: 0; max-height: none; }
  body.mobile-mode .log-content { height: calc(6 * 1.6em); }
  body.mobile-mode .pager { margin-top: 4px; }
  body.mobile-mode .pager button { min-height: 32px; padding: 5px 10px; }
  body.mobile-mode .deck-slot { min-height: 0; }
  body.mobile-mode .card { padding: 6px 8px; }
  #endDesc { max-height: 65dvh !important; overflow-y: auto !important; scrollbar-width: none; }
  #endDesc::-webkit-scrollbar { display: none; }
  @media (max-height: 760px) {
    body.mobile-mode .scene { gap: 4px; }
    body.mobile-mode .party { gap: 28px 6px; padding-top: 28px; }
    body.mobile-mode .figure { height: 30px; }
    body.mobile-mode .figure canvas { width: 26px; }
    body.mobile-mode .slot { gap: 2px; padding-bottom: 4px; }
    body.mobile-mode .fire-wrap { min-height: 30px; margin: 0; }
    body.mobile-mode #fireCanvas { width: 54px; }
    body.mobile-mode .dayLabel { margin-bottom: 2px; }
  }

  .log { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 8px; align-items: start; }
  .log .pager { display: flex; flex-direction: column; justify-content: flex-start; gap: 5px; margin: 0; }
  .log .pager button { width: 34px; height: 32px; padding: 5px; display: grid; place-items: center; }
  .log .pager button[hidden] { display: none; }
  .pager svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #logPageLabel { font-size: 10px; white-space: nowrap; }
  body.mobile-mode .log { grid-template-columns: minmax(0, 1fr) 42px; gap: 6px; }
  body.mobile-mode .log .pager { margin: 0; gap: 4px; }
  body.mobile-mode .log .pager button { width: 40px; height: 34px; min-height: 34px; padding: 6px; }

  /* 固定閱讀面板：內容長短不改變位置與尺寸。 */
  .deck-slot { height: 380px; min-height: 380px; max-height: 380px; justify-content: flex-start; overflow: hidden; }
  .deck-slot > .card, .deck-slot > .empty { width: 100%; height: 100%; min-height: 0; flex: 1; overflow-y: auto; scrollbar-width: none; }
  .deck-slot > .card::-webkit-scrollbar, .deck-slot > .empty::-webkit-scrollbar { display: none; }
  .log { height: 190px; min-height: 190px; max-height: 190px; }
  body.mobile-mode .deck-slot { height: 300px; min-height: 300px; max-height: 300px; }
  body.mobile-mode .log { height: 130px; min-height: 130px; max-height: 130px; }
  .modal:not(.demo) .modal-box { width: 360px; min-width: 0 !important; max-width: calc(100vw - 24px); height: 240px; justify-content: space-between; }
  body.mobile-mode .modal .modal-box { width: 380px; max-width: calc(100vw - 16px); height: 240px; }
  #modalText, #eatInfo { min-height: 0; overflow-y: auto; scrollbar-width: none; }
  #modalText::-webkit-scrollbar, #eatInfo::-webkit-scrollbar { display: none; }

  /* ===== 019：Log 無翻頁、電腦版整體置中與固定對話區 ===== */
  .log, body.mobile-mode .log { display: block; }
  .log .pager { display: none !important; }
  .log-content { height: calc(8 * 1.6em); line-height: 1.6; }
  .log { height: auto; min-height: 0; max-height: none; }
  body.mobile-mode .log { height: auto; min-height: 0; max-height: none; }
  body.mobile-mode .log-content { height: calc(6 * 1.6em); }
  .modal-dock { display: contents; }
  @media (min-width: 900px) {
    body:not(.mobile-mode) { height: 100vh; min-height: 0; padding: 56px 24px 16px; align-items: safe center; overflow: hidden; }
    body:not(.mobile-mode) .scene { max-width: 1240px; gap: 28px; align-items: center; }
    body:not(.mobile-mode) .camp { gap: 14px; }
    body:not(.mobile-mode) .fire-wrap { min-height: 84px; width: 100%; }
    body:not(.mobile-mode) .party { padding: 48px 2px 6px; }
    body:not(.mobile-mode) .modal-dock { display: block; position: relative; width: 100%; height: 220px; }
    body:not(.mobile-mode) .modal-dock .modal { position: absolute; inset: 0; padding: 0; align-items: center; justify-content: center; }

  function drawPartyPersonalities() {
    const optional = Object.keys(PERSONALITY_DEFS).filter(code => code !== 'A' && code !== 'B');
    return shuffleArray(['A', 'B', ...shuffleArray(optional).slice(0, 3)]);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;

  function seededOrder(seed, n) {
    let a = seed >>> 0;
    const rnd = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 先以標點與詞語分組，讓不同螢幕優先在語意邊界換行。
  const proseSegmenter = typeof Intl.Segmenter === 'function'
    ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null;
  const protectedTerms = ['採糧採藥', '突襲王城', '叛國軍閥', '劫匪大軍', '深山洞窟', '可能尋獲食物', ...ALL_NPCS.map(n => n.name), ...ALL_NPCS.map(n => n.title)];
  function proseUnits(text, maxChars = 16) {
    const clauses = text.match(/[^，。！？；：、,.!?;:]+[，。！？；：、,.!?;:]*|[，。！？；：、,.!?;:]+/gu) || [];
    const result = [];
    clauses.forEach(clause => {
      if ([...clause].length <= maxChars) { result.push(clause); return; }
      const escaped = protectedTerms.join('|');
      const pieces = clause.split(new RegExp('(' + escaped + ')', 'u')).filter(Boolean);
      const words = pieces.flatMap(piece => protectedTerms.includes(piece) ? [piece]
        : proseSegmenter ? [...proseSegmenter.segment(piece)].map(x => x.segment) : [piece]);
      let unit = '';
      words.forEach(word => {
        const punctuation = /^[，。！？；：、,.!?;:）】」』]+$/u.test(word);
        if (unit && [...unit + word].length > maxChars && !punctuation) {
          result.push(unit); unit = '';
        }
        unit += word;
      });
      if (unit) result.push(unit);
    });
    return result;
  }
  function renderProse(element, text) {
    element.classList.add('story-text');
    element.replaceChildren();
    String(text).split('\n').forEach((line, index) => {
      if (index) element.appendChild(document.createElement('br'));
      proseUnits(line).forEach(unit => {
        const span = document.createElement('span');
        span.className = 'text-unit';
        span.textContent = unit;
        element.appendChild(span);
      });
    });
  }

  const logEntries = [];
  let logPage = 0;
  let logPages = [];
  let logSequence = 0;
  const pagedTexts = new Map();
  function textTokens(text, source = 0) {
    const tokens = [];
    String(text).split('\n').forEach((line, i) => {
      if (i) tokens.push({ text: '\n', source });
      proseUnits(line).forEach(text => tokens.push({ text, source }));
    });
    return tokens;
  }
  function appendToken(el, token) {
    const node = document.createElement(token.text === '\n' ? 'br' : 'span');
    if (token.text !== '\n') { node.className = 'text-unit'; node.textContent = token.text; }
    el.appendChild(node);
    return node;
  }
  function splitMeasuredPages(tokens, target, height) {
    const style = getComputedStyle(target);
    const probe = document.createElement('div');
    probe.className = 'story-text';
    probe.style.cssText = `position:fixed;left:-10000px;top:0;visibility:hidden;box-sizing:border-box;width:${Math.max(120, target.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight))}px;font:${style.font};line-height:${style.lineHeight};`;
    document.body.appendChild(probe);
    const pages = []; let page = [];
    const groups = [];
    tokens.forEach(token => {
      const last = groups[groups.length - 1];
      if (last && last[0].source === token.source) last.push(token); else groups.push([token]);
    });
    groups.forEach(group => {
      if (group[0].source && page.length) {
        const current = page.slice();
        probe.replaceChildren(); group.forEach(t => appendToken(probe, t));
        const groupHeight = probe.getBoundingClientRect().height;
        probe.replaceChildren(); current.forEach(t => appendToken(probe, t));
        group.forEach(t => appendToken(probe, t));
        const combinedHeight = probe.getBoundingClientRect().height;
        probe.replaceChildren(); current.forEach(t => appendToken(probe, t));
        if (groupHeight <= height && combinedHeight > height + .5) { pages.push(page); page = []; probe.replaceChildren(); }
      }
      group.forEach(token => {
      const node = appendToken(probe, token);
      if (page.length && probe.getBoundingClientRect().height > height + .5) {
        node.remove(); pages.push(page); page = []; probe.replaceChildren();
        appendToken(probe, token);
      }
      page.push(token);
      });
    });
    if (page.length) pages.push(page);
    probe.remove();
    return pages.length ? pages : [[]];
  }
  function drawTokens(el, tokens) {
    el.replaceChildren(); tokens.forEach(token => appendToken(el, token));
  }
  function makePager(onPrevious, onNext) {
    const bar = document.createElement('div'); bar.className = 'pager';
    const prev = document.createElement('button'); prev.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>'; prev.title = '上一頁'; prev.setAttribute('aria-label', '上一頁'); prev.onclick = onPrevious;
    const label = document.createElement('span'); label.setAttribute('aria-live', 'polite');
    const next = document.createElement('button'); next.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'; next.title = '下一頁'; next.setAttribute('aria-label', '下一頁'); next.onclick = onNext;
    label.hidden = true;

  function ensureLogUI() {

  function renderLog(rebuild = false, anchor = null) {

    if (rebuild || !logPages.length) {
      const tokens = logEntries.flatMap((entry, i) => [...(i ? [{ text: '\n', source: entry.id }] : []), ...textTokens(entry.text, entry.id)]);
      logPages = splitMeasuredPages(tokens, content, lineHeight * lines).slice(0, 1);
      if (logEntries.length > 40) logEntries.length = 40;
    }
    logPage = 0;

  function log(msg) {

  // 電腦版：若視窗高度不足（例如 Windows 顯示縮放 125% 使實際可用高度只有 864），整體等比縮小以完整顯示

  // ---------- 每日進食（每次最多吃 2 份） ----------
  function applyEat(id, n, silent = false) {
    const p = people[id];
    if (n <= 0 || p.dead) return;
    p.food -= n;
    p.hunger = Math.min(MAX, p.hunger + HUNGER_RESTORE * n);
    if (!silent) log(`${NAMES[id]} 吃 ${n} 份（飢餓 +${HUNGER_RESTORE * n}）`);
  }

  function pickEatCount(max) {
    return new Promise(resolve => {
      const box = $('eatIcons');
      box.innerHTML = '';
      let sel = Math.min(1, max);
      const icons = [];
      const refresh = () => {
        icons.forEach((c, i) => c.classList.toggle('on', i < sel));
        const afterHunger = Math.min(MAX, people.p1.hunger + HUNGER_RESTORE * sel);
        $('eatInfo').textContent = sel > 0
          ? `吃 ${sel} 份，飢餓度變為 ${afterHunger}/${MAX}`
          : `不吃（目前飢餓 ${people.p1.hunger}/${MAX}）`;
      };
      for (let i = 1; i <= max; i++) {
        const c = document.createElement('canvas');
        drawSprite(c, SPRITES.berry, 5);
        c.addEventListener('click', () => { sel = (sel === i) ? i - 1 : i; refresh(); });
        box.appendChild(c);
        icons.push(c);
      }
      const done = n => {
        $('eatModal').classList.remove('show');
        $('eatOk').onclick = $('eatSkip').onclick = null;
        resolve(n);
      };
      $('eatOk').onclick = () => done(sel);
      $('eatSkip').onclick = () => done(0);
      refresh();
      $('eatModal').classList.add('show');
    });
  }

  async function dailyEat() {
    let ate = false;
    const eatGroups = {};
    IDS.filter(id => id !== 'p1').forEach(id => {
      const p = people[id];
      if (p.dead || p.food <= 0 || p.hunger >= 85) return;
      const need = p.hunger < 55 ? Math.min(p.food, EAT_MAX) : 1;
      applyEat(id, need, true);
      (eatGroups[need] = eatGroups[need] || []).push(NAMES[id]);
      ate = true;
    });
    if (ate) log('進食：' + Object.keys(eatGroups).map(n => {
      const names = eatGroups[n];
      return `${names.join('、')} ${names.length > 1 ? '各' : ''}吃 ${n} 份（+${HUNGER_RESTORE * n}）`;
    }).join('；'));
    render();
    if (ate) await wait(400);
    const p1 = people.p1;
    if (!p1.dead && p1.food > 0 && p1.hunger < MAX) {
      showCard('【清晨進食階段】\n請選擇今天要吃幾份食物（每次最多可吃 2 份）。');
      const n = await pickEatCount(Math.min(p1.food, EAT_MAX));
      if (n > 0) applyEat('p1', n);
      render();
      await wait(300);
    }
  }

  // ---------- 戰利品／食物池與飛行分配 ----------
  const pool = [];
  let pending = 0;
  let distResolve = null;
  let distLeader = null;

  async function spawnMixedPool(items) {
    const box = $('pool');
    box.innerHTML = '';
    pool.length = 0;
    const n = items.length;
    if (!n) return;
    if (n === 1) {
      const key = items[0];
      const cv = document.createElement('canvas');
      drawSprite(cv, SPRITES[key], key === 'berry' ? 3 : 4);
      cv.style.left = '-96px';
      cv.style.top = '14px';
      cv.style.animation = 'popIn .3s ease-out both';
      box.appendChild(cv);
      pool.push({ el: cv, key });
      await wait(340);
      return;
    }
    const half = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const key = items[i];
      const isLeft = i < half;
      const k = isLeft ? i : i - half;
      const col = Math.floor(k / 3), row = k % 3;
      const cv = document.createElement('canvas');
      drawSprite(cv, SPRITES[key], key === 'berry' ? 2 : 2.5);
      cv.style.left = (isLeft ? -(56 + col * 18) - 16 : 56 + col * 18) + 'px';
      cv.style.top = (2 + row * 18) + 'px';
      cv.style.animation = 'popIn .3s ease-out both';
      cv.style.animationDelay = (i * 28) + 'ms';
      box.appendChild(cv);
      pool.push({ el: cv, key });
    }
    await wait(n * 28 + 300);
  }

  async function spawnPool(n, spriteKey = 'berry') {
    const arr = Array.from({ length: n }, () => spriteKey);
    await spawnMixedPool(arr);
  }

  function flyPoolItem(item, targetEl, onLand) {
    const r = item.el.getBoundingClientRect();
    const t = targetEl.getBoundingClientRect();
    const cv = document.createElement('canvas');
    drawSprite(cv, SPRITES[item.key], item.key === 'berry' ? 2 : 3);
    cv.className = 'flyer';
    cv.style.left = r.left + 'px';
    cv.style.top = r.top + 'px';
    document.body.appendChild(cv);
    item.el.remove();
    const dx = t.left + t.width / 2 - 8 - r.left;
    const dy = t.top + t.height / 2 - 8 - r.top;
    const anim = cv.animate(
      [{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px, ${dy}px)` }],
      { duration: 400, easing: 'ease-in', fill: 'forwards' }
    );
    return anim.finished.then(() => { cv.remove(); onLand(); });
  }

  function takeFromPool() {
    return pool.splice(randInt(0, pool.length - 1), 1)[0];
  }

  function checkDistDone() {
    if (distResolve && pool.length === 0 && pending === 0) {
      const r = distResolve;
      distResolve = null;
      r();
    }
  }

  function sendItemFromPool(target) {
    pending++;
    const item = takeFromPool();
    return flyPoolItem(item, $('slot-' + target), () => {
      if (item.key === 'sword') {
        receiveGear(target, 'sword');
      } else if (item.key === 'shield') {
        receiveGear(target, 'shield');
      } else {
        people[target].food += 1;
        if (distLeader === 'p1' && target !== 'p1') NPC_TRUST[target].p1 += 1;
      }
      render();
    }).then(() => { pending--; checkDistDone(); });
  }

  // 輔助計算：角色的整體承受力（內部依是否為武裝衝突決定劍盾是否計入）
  function resilienceScore(id, isCombat = true) {
    const p = people[id];
    if (p.dead) return -999;
    const gearBonus = isCombat ? (p.swords * 16 + p.shields * 24) : 0;
    return p.hp + gearBonus + (p.hunger >= 50 ? 8 : p.hunger <= 20 ? -16 : 0);
  }

  function isCarlTopResourceHolder(carlId) {
    const alive = aliveIds();
    if (!carlId || people[carlId].dead || people[carlId].hp < 50) return false;
    const power = id => (people[id].swords + people[id].shields) * 3 + people[id].food + people[id].hp * 0.05;
    const maxPower = Math.max(...alive.map(power));
    return power(carlId) >= maxPower - 0.5 || (people[carlId].swords + people[carlId].shields) > 0;
  }

  // 性格在同一局內固定；所有同伴重開局重新抽取，隊伍必有 A 與 B。
  function npcDecisionContext(id) {
    const alive = aliveIds();
    const others = alive.filter(x => x !== id);
    const strongest = others.slice().sort((a,b) => resilienceScore(b, currentIsCombat) - resilienceScore(a, currentIsCombat))[0] || id;
    const wounded = alive.slice().sort((a,b) => people[a].hp - people[b].hp)[0];
    const needy = alive.slice().sort((a,b) => (people[a].hunger + people[a].food * HUNGER_RESTORE) - (people[b].hunger + people[b].food * HUNGER_RESTORE))[0];
    const friend = others.slice().sort((a,b) => NPC_TRUST[id][b] - NPC_TRUST[id][a] || people[b].hp - people[a].hp)[0] || id;
    const resented = others.filter(x => NPC_TRUST[id][x] < 0).sort((a,b) => NPC_TRUST[id][a] - NPC_TRUST[id][b])[0];
    return { alive, others, strongest, wounded, needy, friend, resented };
  }

  function personalityVote(voter, mode) {
    const trait = getNpcBehavior(voter);
    const { alive, others, strongest, wounded, needy, friend, resented } = npcDecisionContext(voter);
    const me = people[voter];
    if (!others.length) return voter;
    const danger = mode === 'danger';
    const fit = me.hp >= 55 && me.hunger >= 25;
    const scared = currentDangerPct >= 55 || !fit;
    if (trait === 'noah' || trait === 'cowardly') {
      if (danger) return scared ? strongest : (me.hunger < 40 && me.hp >= 70 ? voter : strongest);
      if (mode === 'shield' || mode === 'inheritance' || (mode === 'herb' && me.hp < 85)) return voter;
      return mode === 'sword' ? strongest : wounded;
    }
    if (trait === 'eilin') {
      if (danger) return fit && currentDangerPct <= 35 ? voter : strongest;
      if (mode === 'herb') return me.hp <= 45 ? voter : wounded;
      if (mode === 'sword') return strongest;
      if (mode === 'shield') return me.hp <= 60 ? voter : wounded;
      return needy;
    }
    if (trait === 'andy') {
      if (danger) return fit ? voter : strongest;
      if (mode === 'herb') return me.hp < 75 ? voter : wounded;
      if (mode === 'sword' || mode === 'inheritance') return voter;
      return wounded;
    }
    if (trait === 'mina') {
      if (danger) return resented || strongest;
      if (mode === 'herb') return me.hp <= 40 ? voter : (people[friend].hp < 80 ? friend : wounded);
      return friend;
    }
    if (trait === 'hans') {
      if (danger) return fit ? voter : strongest;
      if (mode === 'sword' || mode === 'shield') return fit ? voter : strongest;
      if (mode === 'herb') return me.hp <= 55 ? voter : wounded;
      return needy;
    }
    if (trait === 'rodi' || trait === 'selfless' || trait === 'reckless') {
      if (danger) return (trait === 'reckless' ? me.hp > 20 : fit) ? voter : strongest;
      if (mode === 'sword') return fit ? voter : strongest;
      if (mode === 'herb' || mode === 'shield') return wounded;
      return needy;
    }
    if (trait === 'mabi') {
      if (danger) return resented || (currentDangerPct <= 40 && fit ? voter : strongest);
      if (mode === 'herb') return me.hp < 90 ? voter : friend;
      return voter;
    }
    if (trait === 'jess') {
      if (danger) return currentDangerPct <= 40 && fit ? voter : strongest;
      if (mode === 'herb') return me.hp <= 35 ? voter : wounded;
      if (mode === 'sword') return strongest;
      if (mode === 'shield') return me.hp <= 55 ? voter : friend;
      return needy;
    }
    if (trait === 'selfish') {
      if (danger) return currentDangerPct <= 40 && fit ? voter : strongest;
      return mode === 'herb' && me.hp === MAX ? strongest : voter;
    }
    return null;
  }

  function personalityFoodDistribution(leader, total) {
    const trait = getNpcBehavior(leader);
    if (!['noah','eilin','andy','mina','hans','rodi','mabi','jess',...MIEN_EXTREMES].includes(trait)) return null;
    const { alive, others, friend } = npcDecisionContext(leader);
    const alloc = Object.fromEntries(IDS.map(id => [id, 0]));
    if (!others.length) { alloc[leader] = total; return alloc; }
    let reserve = 0;
    if (['noah','cowardly'].includes(trait)) reserve = people[leader].hunger < 40 ? 4 : 3;
    if (trait === 'andy') reserve = people[leader].hunger < 45 ? 4 : 3;
    if (trait === 'hans') reserve = people[leader].hunger < 45 ? 3 : 2;
    if (['mabi','selfish'].includes(trait)) reserve = Math.ceil(total * 0.5);
    alloc[leader] = Math.min(total, reserve);
    for (let i = alloc[leader]; i < total; i++) {
      const candidates = alive.slice().sort((a,b) => {
        const score = id => {
          let value = people[id].hunger + (people[id].food + alloc[id]) * HUNGER_RESTORE;
          if (id === leader && ['noah','cowardly','andy','hans','mabi','selfish'].includes(trait)) value += 100;
          if (id === leader && ['eilin','rodi','selfless','jess'].includes(trait)) value += 12;
          if (trait === 'mina' && id === friend) value -= 24;
          if (trait === 'mabi') value -= Math.max(-3, NPC_TRUST[leader][id]) * 8;
          if (trait === 'hans' && id !== leader && people[id].hp >= 55 && people[id].hunger < 40) value -= 12;
          if (trait === 'jess' && people[id].hp < 50) value -= 12;
          return value;
        };
        return score(a) - score(b) || people[a].hp - people[b].hp;
      });
      alloc[candidates[0]]++;
    }
    return alloc;
  }

  // ---------- 6位角色的「食物」分配邏輯 ----------
  function planNpcFoodDistribution(leader, total) {
    const personalityPlan = personalityFoodDistribution(leader, total);
    if (personalityPlan) return personalityPlan;
    const role = getNpcBehavior(leader);
    const alive = aliveIds();
    const others = alive.filter(id => id !== leader);
    const alloc = {};
    IDS.forEach(id => { alloc[id] = 0; });
    if (!others.length) { alloc[leader] = total; return alloc; }

    if (role === 'mary') {
      for (let i = 0; i < total; i++) {
        const candidates = alive.slice().sort((a, b) => {
          const effHungerA = people[a].hunger + (people[a].food + alloc[a]) * HUNGER_RESTORE + (a === leader ? 4 : 0);
          const effHungerB = people[b].hunger + (people[b].food + alloc[b]) * HUNGER_RESTORE + (b === leader ? 4 : 0);
          if (effHungerA !== effHungerB) return effHungerA - effHungerB;
          return people[a].hp - people[b].hp;
        });
        alloc[candidates[0]]++;
      }
      return alloc;
    }

    if (role === 'carl') {
      const mine = Math.min(total, Math.max(3, Math.ceil(total * 0.45)));
      alloc[leader] = mine;
      let rest = total - mine;
      let worthy = others.filter(id => people[id].hp > 42 && people[id].hunger > 15);
      if (!worthy.length) {
        worthy = others.slice().sort((a, b) => people[b].hp - people[a].hp).slice(0, Math.max(1, Math.ceil(others.length / 2)));
      }
      worthy.forEach((id, idx) => {
        alloc[id] = Math.floor(rest / worthy.length) + (idx < (rest % worthy.length) ? 1 : 0);
      });
      return alloc;
    }

    let mine = 2;
    if (role === 'noah') {
      mine = Math.random() < 0.35 ? (Math.random() < 0.5 ? 0 : 1) : Math.min(total, randInt(2, 3));
    } else if (role === 'eilin') {
      mine = Math.random() < 0.65 ? Math.min(total, Math.max(3, Math.ceil(total * 0.45))) : 1;
    } else if (role === 'mien') {
      const roll = Math.random();
      mine = roll < 0.33 ? 0 : roll < 0.66 ? Math.max(1, Math.floor(total / alive.length)) : Math.min(total, Math.ceil(total * 0.45));
    } else {
      const selfNeed = people[leader].hunger < 45 ? 3 : 2;
      mine = Math.min(total, selfNeed);
    }

    alloc[leader] = mine;
    let rest = total - mine;
    const receivers = others.slice().sort((a, b) => {
      return (people[a].hunger + randInt(-12, 12)) - (people[b].hunger + randInt(-12, 12));
    });
    receivers.forEach(id => { alloc[id] = Math.floor(rest / receivers.length); });
    for (let k = 0; k < rest % receivers.length; k++) {
      alloc[receivers[k]]++;
    }
    return alloc;
  }

  async function distributeNpcFood() {
    const alloc = planNpcFoodDistribution(distLeader, pool.length);
    aliveIds().filter(id => id !== distLeader).forEach(id => {
      NPC_TRUST[id][distLeader] += alloc[id] > 0 ? Math.min(2, alloc[id]) : -1;
    });
    const chunks = aliveIds().filter(id => alloc[id] > 0).map(id => [id, alloc[id]]);
    const role = getNpcBehavior(distLeader);
    if (role === 'carl' || role === 'eilin') {
      chunks.sort((a, b) => (b[0] === distLeader) - (a[0] === distLeader));
    }
    const result = {};
    IDS.forEach(id => { result[id] = 0; });
    const ps = [];
    for (let i = 0; i < chunks.length; i++) {
      const [t, c] = chunks[i];
      for (let k = 0; k < c; k++) {
        ps.push(sendItemFromPool(t));
        result[t]++;
        await wait(85);
      }
      if (i < chunks.length - 1) await wait(240);
    }
    await Promise.all(ps);
    return result;
  }

  // ---------- 6人投票系統 ----------
  let votes = {};
  let pendingTarget = null;
  let blinkTimers = {};
  let voteFinishResolve = null;
  let currentVoteMode = 'danger'; // 'danger' | 'sword' | 'shield' | 'herb' | 'inheritance' | 'epilogue'

  function setPick(voter, target, showTag = false) {
    const box = $('pick-' + voter);
    box.textContent = '';
    if (!target) { box.classList.remove('show'); return; }
    if (target === 'stay') {
      box.style.background = '#b8862d';
      if (showTag) box.textContent = '留下';
    } else if (target === 'leave') {
      box.style.background = '#4f6b8a';
      if (showTag) box.textContent = '離開';
    } else {
      box.style.background = TUNIC[target];
      if (showTag) box.textContent = target.toUpperCase();
    }
    box.classList.add('show');
  }

  function setDone(voter) {
    if (people[voter].dead) return;
    const box = $('pick-' + voter);
    box.style.background = 'var(--line)';
    box.textContent = voter === 'p1' ? '' : '?';
    box.classList.add('show');
  }

  const SWORD_LIMIT = 2;
  const SHIELD_LIMIT = 1;
  function canReceiveGear(id, key) {
    return !people[id].dead && (key === 'sword' ? people[id].swords < SWORD_LIMIT : people[id].shields < SHIELD_LIMIT);
  }
  function receiveGear(id, key) {
    if (!canReceiveGear(id, key)) return false;
    people[id][key === 'sword' ? 'swords' : 'shields']++;
    return true;
  }
  function eligibleVoteTargets(mode) {
    return aliveIds().filter(id => !['sword','shield'].includes(mode) || canReceiveGear(id, mode));
  }
  function syncPendingSelection() {
    IDS.forEach(id => $('slot-' + id).classList.toggle('selected', id === pendingTarget));
  }
  function gearVoteWarning(target) {
    const text = currentVoteMode === 'shield'
      ? `${NAMES[target]} 已持有盾牌，請選其他人。`
      : `${NAMES[target]} 已持有2把鐵劍，請選其他人。`;
    $('voteNotice').textContent = text;
    $('voteNotice').style.display = 'block';
  }
  function chooseNpcTarget(voter, mode) {
    const eligible = eligibleVoteTargets(mode);
    const chosen = chooseNpcTargetByPersonality(voter, mode);
    if (eligible.includes(chosen)) return chosen;
    if (!eligible.length) return null;
    return eligible.slice().sort((a,b) => mode === 'shield' ? people[a].hp - people[b].hp : resilienceScore(b, true) - resilienceScore(a, true))[0];
  }
  async function awardLimitedGear(key, context = '') {
    const name = key === 'sword' ? '生鏽鐵劍' : '腐朽木盾';
    if (!eligibleVoteTargets(key).length) {
      log(`所有人都已有足夠的${name}，留下這件裝備。`);
      return;
    }
    await spawnPool(1, key);
    await runVoteSession(`【${context || name}】\n${key === 'sword' ? '武器可能有助團體防禦，也能保護自己。' : '防具通常只能保護自己。'}\n投票交給誰？`, key);
    const winner = await getSingleWinner(`獲得了【${name}】`);
    if (pool.length) await flyPoolItem(takeFromPool(), $('slot-' + winner), () => { receiveGear(winner, key); render(); });
    await showStepCard(`【表決結果】\n【${name}】交由 ${NAMES[winner]} 持有。`, '繼續');
  }

  // 角色的投票決策邏輯
  function chooseNpcTargetByPersonality(voter, mode) {
    const role = getNpcBehavior(voter);
    const alive = aliveIds();
    const others = alive.filter(id => id !== voter);
    if (!others.length) return voter;
    const personalityTarget = personalityVote(voter, mode);
    if (personalityTarget) return personalityTarget;

    // ================== 【瑪莉 mary】衡量整體狀態型 ==================
    if (role === 'mary') {
      if (mode === 'sword') {
        const noSword = alive.filter(id => people[id].swords === 0);
        const poolList = noSword.length ? noSword : alive;
        return poolList.slice().sort((a, b) => resilienceScore(b, true) - resilienceScore(a, true))[0];
      }
      if (mode === 'shield' || mode === 'herb') {
        return alive.slice().sort((a, b) => people[a].hp - people[b].hp)[0];
      }
      if (mode === 'inheritance') {
        return alive.slice().sort((a, b) => {
          const scoreA = people[a].hunger + people[a].food * HUNGER_RESTORE + (a === voter ? 3 : 0);
          const scoreB = people[b].hunger + people[b].food * HUNGER_RESTORE + (b === voter ? 3 : 0);
          return scoreA - scoreB;
        })[0];
      }
      const ranked = alive.slice().sort((a, b) => resilienceScore(b, currentIsCombat) - resilienceScore(a, currentIsCombat));
      const bestId = ranked[0];
      const maxScore = resilienceScore(bestId, currentIsCombat);
      const maryScore = resilienceScore(voter, currentIsCombat);

      if (people[voter].hp <= 55 || people[voter].hunger <= 24) {
        return others.slice().sort((a, b) => resilienceScore(b, currentIsCombat) - resilienceScore(a, currentIsCombat))[0];
      }
      if (maxScore - maryScore <= 12) {
        return voter;
      }
      return bestId;
    }

    // ================== 【卡爾 carl】弱者汰除＋肥差搶奪＋終局強者挺身 ==================
    if (role === 'carl') {
      if (mode === 'sword' || mode === 'shield' || mode === 'inheritance') {
        return voter;
      }
      if (mode === 'herb') {
        // 只要自己有受傷就搶草藥；若自己幾乎滿血則投給戰力最強的人（或自己）
        if (people[voter].hp < 92) return voter;
        return alive.slice().sort((a, b) => resilienceScore(b, true) - resilienceScore(a, true))[0];
      }
      // 終局反轉（第 25~30 天毀滅級危險，若自己是資源/裝備強者，主動挺身而出）
      if (day >= 25 && currentDangerPct >= 75 && isCarlTopResourceHolder(voter)) {
        return voter;
      }
      // 輕鬆肥差搶資源（危險 <= 46% 且有食物可拿，若血量 >= 55 則搶著出發壟斷分配權）
      if (currentDangerPct <= 46 && currentPlan && currentPlan.type !== 'herb_gather' && currentPlan.gained > 0 && people[voter].hp >= 55) {
        return voter;
      }
      // 汰除弱者（把快死的人送出去送死）
      const weaklings = others.filter(id => people[id].hp <= 48 || (people[id].hp + people[id].hunger * 0.5) <= 68);
      if (weaklings.length > 0) {
        weaklings.sort((a, b) => (people[a].hp + people[a].hunger * 0.3) - (people[b].hp + people[b].hunger * 0.3));
        return weaklings[0];
      }
      return others[randInt(0, others.length - 1)];
    }

    // ================== 諾亞、李歐、米恩 ==================
    if (role === 'noah') {
      if (mode === 'herb') {
        if (Math.random() < 0.35 && lastHerbGatherer && !people[lastHerbGatherer].dead && people[lastHerbGatherer].hp < MAX) {
          return lastHerbGatherer;
        }
        return people[voter].hp < 80 ? voter : alive.slice().sort((a, b) => people[a].hp - people[b].hp)[0];
      }
      if (mode !== 'danger') return Math.random() < 0.35 ? (!people.p1.dead ? 'p1' : others[0]) : voter;
      return Math.random() < 0.35 ? voter : others[randInt(0, others.length - 1)];
    }
    if (role === 'eilin') {
      if (mode === 'herb') {
        if (people[voter].hp < 95 && Math.random() < 0.8) return voter;
        return alive.slice().sort((a, b) => people[a].hp - people[b].hp)[0];
      }
      if (mode !== 'danger') return Math.random() < 0.75 ? voter : others[randInt(0, others.length - 1)];
      if (Math.random() < 0.65) {
        return others.slice().sort((a, b) => people[a].hp - people[b].hp)[0];
      }
      return others[randInt(0, others.length - 1)];
    }
    if (role === 'mien') {
      if (mode !== 'danger') return alive[randInt(0, alive.length - 1)];
      if (Math.random() < 0.5) {
        return alive.slice().sort((a, b) => people[b].food - people[a].food)[0];
      }
      return alive[randInt(0, alive.length - 1)];
    }

    // ================== 一般末日常人角色（安迪、敏娜、漢斯、羅帝、馬比丘、安娜） ==================
    if (mode === 'sword') {
      if (Math.random() < 0.40) return voter;
      const strongPool = alive.slice().sort((a, b) => resilienceScore(b, true) - resilienceScore(a, true)).slice(0, 3);
      return strongPool[randInt(0, strongPool.length - 1)];
    }
    if (mode === 'shield') {
      if (people[voter].hp <= 55 && Math.random() < 0.65) return voter;
      const roll = Math.random();
      if (roll < 0.38) {
        const swordHolders = alive.filter(id => people[id].swords > 0);
        if (swordHolders.length) return swordHolders[randInt(0, swordHolders.length - 1)];
      } else if (roll < 0.75) {
        const wounded = alive.slice().sort((a, b) => people[a].hp - people[b].hp);
        return wounded[0];
      }
      return voter;
    }
    if (mode === 'herb') {
      // 常人面對唯一一株草藥：自己重傷時想自救；否則在「剛才冒險採藥且受傷的人」與「全隊傷勢最重的人」之間抉擇
      if (people[voter].hp <= 55 && Math.random() < 0.65) return voter;
      if (lastHerbGatherer && !people[lastHerbGatherer].dead && people[lastHerbGatherer].hp < 85 && Math.random() < 0.45) {
        return lastHerbGatherer;
      }
      return alive.slice().sort((a, b) => people[a].hp - people[b].hp)[0];
    }
    if (mode === 'inheritance') {
      if (people[voter].hunger <= 35 && Math.random() < 0.55) return voter;
      return alive[randInt(0, alive.length - 1)];
    }

    // 面對危險任務（mode === 'danger'）
    if ((role === 'hans' || role === 'rodi') && currentDangerPct <= 45 && people[voter].hp >= 80 && Math.random() < 0.18) {
      return voter;
    }
    if (Math.random() < 0.65) {
      const topCandidates = others.slice().sort((a, b) => resilienceScore(b, currentIsCombat) - resilienceScore(a, currentIsCombat)).slice(0, Math.min(3, others.length));
      return topCandidates[randInt(0, topCandidates.length - 1)];
    }
    return others[randInt(0, others.length - 1)];
  }

  function npcVote(voter, mode) {
    if (people[voter].dead) return;
    const alive = aliveIds();
    const duration = randInt(VOTE_MIN_MS, VOTE_MAX_MS);
    const speed = 280 + randInt(0, 180);
    let i = randInt(0, alive.length - 1);
    blinkTimers[voter] = setInterval(() => {
      setPick(voter, alive[i % alive.length], false);
      i++;
    }, speed);
    setTimeout(() => {
      clearInterval(blinkTimers[voter]);
      votes[voter] = chooseNpcTarget(voter, mode);
      setDone(voter);
      checkAllVoted();
    }, duration);
  }

  // ---------- 連按三次「你」(P1) 切換手機全螢幕模式 ----------
  let p1TapTimes = [];
  let p2TapTimes = [];
  let p1VoteModalTimer = null;

  function hideCornerHint() {
    const ch = $('cornerHint');
    if (ch && !ch.classList.contains('hide')) {
      ch.classList.add('hide');
    }
  }

  function toggleMobileMode() {
    hideCornerHint();
    const isNowMobile = document.body.classList.toggle('mobile-mode');
    fitDesktop();
    reflowReadingPages();
    if (isNowMobile) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
      }
    } else {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }
    render();
  }

  function openVoteModalFor(target) {
    if (phase !== 'vote' || currentVoteMode === 'epilogue' || votes.p1 || people[target].dead) return;
    if (!eligibleVoteTargets(currentVoteMode).includes(target)) {
      gearVoteWarning(target);
      return;
    }
    if (p1VoteModalTimer) { clearTimeout(p1VoteModalTimer); p1VoteModalTimer = null; }
    $('voteNotice').style.display = 'none';
    pendingTarget = target;
    syncPendingSelection();
    setPick('p1', target, true);
    const self = target === 'p1' ? '（自己）' : '';
    const actionTxt = currentVoteMode === 'sword'
      ? `把【生鏽鐵劍】投給 ${NAMES[target]}${self}？`
      : currentVoteMode === 'shield'
      ? `把【腐朽木盾】投給 ${NAMES[target]}${self}？`
      : currentVoteMode === 'herb'
      ? `把【草藥】投給 ${NAMES[target]}${self}？`
      : currentVoteMode === 'inheritance'
      ? `把【無法均分的剩餘遺物】投給 ${NAMES[target]}${self}？`
      : `投給 ${NAMES[target]}${self}？`;
    renderProse($('modalText'), actionTxt);
    $('modalOk').textContent = '確定';
    $('modalCancel').textContent = '取消';
    $('modalCancel').className = 'ghost';
    $('modal').classList.add('show');
  }

  IDS.forEach(target => {
    const el = $('slot-' + target);
    el.addEventListener('click', () => {
      // 1 秒內連按 3 次 P2：整個重新開始，並切換為「有頭銜版」（保留手機模式設定）
      if (target === 'p2') {
        const now = Date.now();
        p2TapTimes = p2TapTimes.filter(t => now - t <= 1000);
        p2TapTimes.push(now);
        if (p2TapTimes.length >= 3) {
          p2TapTimes = [];
          const mobile = document.body.classList.contains('mobile-mode');
          // 開關：目前無頭銜 → 開啟頭銜；目前有頭銜 → 關閉頭銜；兩者都整個重新開始
          const parts = [];
          if (!TITLED) parts.push('titled');
          if (mobile) parts.push('mobile');
          location.hash = parts.length ? '#' + parts.join(',') : '';
          location.reload();
          return;
        }
      }
      // 檢測是否在 1 秒內連續點擊 3 次「你」(p1)
      if (target === 'p1') {
        const now = Date.now();
        p1TapTimes = p1TapTimes.filter(t => now - t <= 1000);
        p1TapTimes.push(now);
        if (p1TapTimes.length >= 3) {
          p1TapTimes = [];
          if (p1VoteModalTimer) { clearTimeout(p1VoteModalTimer); p1VoteModalTimer = null; }
          if (currentVoteMode !== 'epilogue') {
            pendingTarget = null;
    syncPendingSelection();
            $('modal').classList.remove('show');
          }
          toggleMobileMode();
          return;
        }
      }

      // 分食物階段
      if (phase === 'distribute' && distLeader === 'p1' && pool.length && !people[target].dead) {
        sendItemFromPool(target);
        return;
      }

      // 一般投票階段
      if (phase === 'vote' && currentVoteMode !== 'epilogue' && !votes.p1 && !people[target].dead) {
        if (target === 'p1') {
          if (p1VoteModalTimer) clearTimeout(p1VoteModalTimer);
          p1VoteModalTimer = setTimeout(() => {
            p1VoteModalTimer = null;
            openVoteModalFor('p1');
          }, 260);
        } else {
          openVoteModalFor(target);
        }
      }
    });

    el.addEventListener('mouseenter', () => {
      if (phase !== 'vote' || currentVoteMode === 'epilogue' || votes.p1 || pendingTarget || people[target].dead) return;
      el.classList.add('hover');
      setPick('p1', target, true);
    });
    el.addEventListener('mouseleave', () => {
      el.classList.remove('hover');
      if (phase !== 'vote' || currentVoteMode === 'epilogue' || votes.p1 || pendingTarget) return;
      setDone('p1');
    });
  });

  $('modalOk').addEventListener('click', () => {
    if (currentVoteMode === 'epilogue') return;
    if (!pendingTarget) return;
    if (!eligibleVoteTargets(currentVoteMode).includes(pendingTarget)) { gearVoteWarning(pendingTarget); return; }
    votes.p1 = pendingTarget;
    setDone('p1');
    pendingTarget = null;
    syncPendingSelection();
    $('modal').classList.remove('show');
    checkAllVoted();
  });

  $('modalCancel').addEventListener('click', () => {
    if (currentVoteMode === 'epilogue') return;

    syncPendingSelection();
    $('modal').classList.remove('show');

  let revealing = false;
  async function countdown() {
    const el = $('countdown');
    el.classList.add('show');
    for (const n of [2, 1]) {
      el.textContent = n;
      await wait(480);
    }
    el.classList.remove('show');
    await wait(140);
  }

  async function checkAllVoted() {
    if (currentVoteMode === 'epilogue') return;
    const alive = aliveIds();
    if (revealing || !alive.every(id => votes[id])) return;
    revealing = true;
    phase = 'resolve';
    await countdown();
    await revealVotes();
    if (voteFinishResolve) {
      const r = voteFinishResolve;
      voteFinishResolve = null;
      r();
    }
  }

  async function revealVotes() {
    const count = {};
    IDS.forEach(id => { count[id] = 0; });
    for (const id of aliveIds()) {
      const target = votes[id];
      setPick(id, target, true);
      count[target]++;
      const t = $('tally-' + target);
      t.textContent = count[target] + '票';
      t.classList.add('show');
      await wait(240);
    }
    log('投票：' + aliveIds().filter(id => count[id] > 0).sort((a, b) => count[b] - count[a]).map(id => `${NAMES[id]} ${count[id]} 票`).join('、'));
    const top = tally();
    top.forEach(id => $('slot-' + id).classList.add('win'));
    await wait(1150);
    top.forEach(id => $('slot-' + id).classList.remove('win'));
    IDS.forEach(id => $('tally-' + id).classList.remove('show'));
  }

  function tally() {
    const alive = aliveIds();
    const count = {};
    IDS.forEach(id => { count[id] = 0; });
    alive.forEach(id => { if (votes[id]) count[votes[id]]++; });
    const max = Math.max(...alive.map(id => count[id]));
    return alive.filter(id => count[id] === max);
  }

  async function flashTied(ids) {
    ids.forEach(id => $('slot-' + id).classList.add('tie'));
    await wait(950);
    ids.forEach(id => $('slot-' + id).classList.remove('tie'));
  }

  // 平手抽牌動畫
  async function drawCard(tied) {
    const alive = aliveIds();
    const fr = $('fireCanvas').getBoundingClientRect();
    const cx = fr.left + fr.width / 2;
    const cy = Math.min(window.innerHeight - 60, fr.top + fr.height / 2);
    const W = 28, H = 36;

    alive.forEach(id => setDone(id));
    if (!people.p1.dead) $('pick-p1').textContent = '?';
    await wait(300);

    const cards = alive.map(id => {
      const r = $('pick-' + id).getBoundingClientRect();
      const c = document.createElement('div');
      c.className = 'dcard';
      c.textContent = '?';
      c.style.left = (r.left + r.width / 2 - W / 2) + 'px';
      c.style.top = (r.top + r.height / 2 - H / 2) + 'px';
      document.body.appendChild(c);
      return { id, el: c };
    });
    IDS.forEach(id => setPick(id, null));

    const base = c => ({
      dx: cx - W / 2 - parseFloat(c.el.style.left),
      dy: cy - H / 2 - parseFloat(c.el.style.top),
    });

    await Promise.all(cards.map((c, i) => {
      const { dx, dy } = base(c);
      return c.el.animate(
        [{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px, ${dy}px)` }],
        { duration: 420, easing: 'ease-in-out', fill: 'forwards', delay: i * 35 }
      ).finished;
    }));

    for (let round = 0; round < 2; round++) {
      await Promise.all(cards.map(c => {
        const { dx, dy } = base(c);
        const ox = randInt(-14, 14), oy = randInt(-5, 5), rot = randInt(-9, 9);
        return c.el.animate(
          [
            { transform: `translate(${dx}px, ${dy}px)` },
            { transform: `translate(${dx + ox}px, ${dy + oy}px) rotate(${rot}deg)`, offset: 0.5 },
            { transform: `translate(${dx}px, ${dy}px)` },
          ],
          { duration: 220, easing: 'ease-in-out' }
        ).finished;
      }));
    }

    cards.forEach(c => {
      const { dx, dy } = base(c);
      c.el.getAnimations().forEach(a => a.cancel());
      c.el.style.left = (parseFloat(c.el.style.left) + dx) + 'px';
      c.el.style.top = (parseFloat(c.el.style.top) + dy) + 'px';
      c.el.style.transform = 'none';
    });

    const cardPool = cards.filter(c => tied.includes(votes[c.id]));
    const drawn = cardPool[randInt(0, cardPool.length - 1)];
    document.body.appendChild(drawn.el);

    for (const n of [2, 1]) {
      drawn.el.textContent = n;
      await wait(480);
    }
    drawn.el.textContent = '?';
    await wait(160);

    await drawn.el.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(60px)' }],
      { duration: 340, easing: 'ease-out', fill: 'forwards' }
    ).finished;
    drawn.el.style.transform = 'translateX(60px)';
    drawn.el.getAnimations().forEach(a => a.cancel());
    await wait(160);

    await drawn.el.animate(
      [{ transform: 'translateX(60px) scaleX(1)' }, { transform: 'translateX(60px) scaleX(0)' }],
      { duration: 160, easing: 'ease-in', fill: 'forwards' }
    ).finished;
    const winner = votes[drawn.id];
    drawn.el.textContent = winner.toUpperCase();
    drawn.el.style.background = TUNIC[winner];
    await drawn.el.animate(
      [{ transform: 'translateX(60px) scaleX(0)' }, { transform: 'translateX(60px) scaleX(1)' }],
      { duration: 160, easing: 'ease-out', fill: 'forwards' }
    ).finished;

    $('slot-' + winner).classList.add('win');
    await wait(1150);
    $('slot-' + winner).classList.remove('win');
    cards.forEach(c => c.el.remove());
    return winner;
  }

  async function runVoteSession(cardText, mode = 'danger') {
    currentVoteMode = mode;
    pendingTarget = null;
    syncPendingSelection();
    $('voteNotice').style.display = 'none';
    votes = {};
    IDS.forEach(id => { votes[id] = null; });
    revealing = false;
    IDS.forEach(id => setPick(id, null));
    setDone('p1');
    showCard(cardText, false);
    $('expedBtn').textContent = '請點選角色卡片進行投票';
    $('expedBtn').disabled = true;
    phase = 'vote';
    IDS.filter(id => id !== 'p1').forEach(id => npcVote(id, mode));
    await new Promise(res => { voteFinishResolve = res; });
  }

  async function getSingleWinner(actionLabel) {
    const tied = tally();
    let winner;
    if (tied.length === 1) {
      winner = tied[0];
      log(`投票結果：${NAMES[winner]} ${actionLabel}。`);
    } else {
      log(`平手（${tied.map(id => NAMES[id]).join('、')}），洗牌抽籤決定！`);
      await flashTied(tied);
      winner = await drawCard(tied);
      log(`抽籤結果：${NAMES[winner]} ${actionLabel}！`);
    }
    IDS.forEach(id => setPick(id, null));
    return winner;
  }

  // ---------- 陣亡檢查與遺物分配（先盡量均分，最後無法均分的餘數投票決定全歸誰） ----------
  async function handleDeathsAndInheritance() {
    const newlyDead = IDS.filter(id => people[id].hp <= 0 && !people[id].dead);
    if (!newlyDead.length) return false;

    let totalFood = 0;
    let totalSwords = 0;
    let totalShields = 0;
    const deadNames = newlyDead.map(id => NAMES[id]).join('、');

    newlyDead.forEach(id => {
      people[id].hp = 0;
      people[id].dead = true;
      totalFood += people[id].food;
      totalSwords += people[id].swords;
      totalShields += people[id].shields;
      people[id].food = 0;
      people[id].swords = 0;
      people[id].shields = 0;
      log(`【陣亡】${NAMES[id]} 傷重不治倒下了……`);
    });
    render();

    if (people.p1.dead) return true;
    const alive = aliveIds();
    if (!alive.length) return true;

    if (totalFood === 0 && totalSwords === 0 && totalShields === 0) {
      await showStepCard(`【同伴陣亡】\n${deadNames} 倒下了，身上沒有留下任何物資。`, '繼續');
      return false;
    }

    for (let i = 0; i < totalSwords; i++) await awardLimitedGear('sword', '遺物：生鏽鐵劍');
    for (let i = 0; i < totalShields; i++) await awardLimitedGear('shield', '遺物：腐朽木盾');
    totalSwords = 0;
    totalShields = 0;

    const nAlive = alive.length;
    const evenFood = Math.floor(totalFood / nAlive);
    const remFood = totalFood % nAlive;
    const evenSwords = Math.floor(totalSwords / nAlive);
    const remSwords = totalSwords % nAlive;
    const evenShields = Math.floor(totalShields / nAlive);
    const remShields = totalShields % nAlive;

    // 1. 先處理可均分的部分
    if (evenFood > 0 || evenSwords > 0 || evenShields > 0) {
      const evenParts = [];
      if (evenFood > 0) evenParts.push(`食物各 ${evenFood} 份`);
      if (evenSwords > 0) evenParts.push(`生鏽鐵劍各 ${evenSwords} 把`);
      if (evenShields > 0) evenParts.push(`腐朽木盾各 ${evenShields} 面`);

      const itemsToFly = [];
      for (let i = 0; i < evenFood * nAlive; i++) itemsToFly.push('berry');
      for (let i = 0; i < evenSwords * nAlive; i++) itemsToFly.push('sword');
      for (let i = 0; i < evenShields * nAlive; i++) itemsToFly.push('shield');

      await showStepCard(
        `【遺物均分】\n${deadNames} 倒下了，生前留下的物資由生還的 ${nAlive} 人先盡量均分。\n每人分得：${evenParts.join('、')}。`,
        '領取均分遺物'
      );

      await spawnMixedPool(itemsToFly);
      const flyPromises = [];
      for (const id of alive) {
        for (let k = 0; k < evenFood; k++) {
          const item = pool.find(x => x.key === 'berry') || takeFromPool();
          pool.splice(pool.indexOf(item), 1);
          flyPromises.push(flyPoolItem(item, $('slot-' + id), () => { people[id].food += 1; render(); }));
        }
        for (let k = 0; k < evenSwords; k++) {
          const item = pool.find(x => x.key === 'sword') || takeFromPool();
          pool.splice(pool.indexOf(item), 1);
          flyPromises.push(flyPoolItem(item, $('slot-' + id), () => { receiveGear(id, 'sword'); render(); }));
        }
        for (let k = 0; k < evenShields; k++) {
          const item = pool.find(x => x.key === 'shield') || takeFromPool();
          pool.splice(pool.indexOf(item), 1);
          flyPromises.push(flyPoolItem(item, $('slot-' + id), () => { receiveGear(id, 'shield'); render(); }));
        }
      }
      await Promise.all(flyPromises);
      log(`${deadNames} 的遺物已均分給所有生還者（每人 ${evenParts.join('、')}）。`);
    }

    // 2. 無法均分的餘數：投票決定剩下的全部歸誰
    if (remFood > 0 || remSwords > 0 || remShields > 0) {
      const remParts = [];
      if (remFood > 0) remParts.push(`${remFood} 份食物`);
      if (remSwords > 0) remParts.push(`${remSwords} 把生鏽鐵劍`);
      if (remShields > 0) remParts.push(`${remShields} 面腐朽木盾`);
      const remDesc = remParts.join('、');

      const remItems = [];
      for (let i = 0; i < remFood; i++) remItems.push('berry');
      for (let i = 0; i < remSwords; i++) remItems.push('sword');
      for (let i = 0; i < remShields; i++) remItems.push('shield');

      await spawnMixedPool(remItems);
      log(`火堆旁放著無法均分的遺物（${remDesc}），進入全員投票！`);
      await runVoteSession(
        `【剩餘遺物投票】\n${deadNames} 留下了無法均分的【${remDesc}】。\n剩下的全部歸誰？`,
        'inheritance'
      );
      const winner = await getSingleWinner(`獨得剩餘遺物（${remDesc}）`);

      const remPromises = [];
      while (pool.length > 0) {
        const item = takeFromPool();
        remPromises.push(flyPoolItem(item, $('slot-' + winner), () => {
          if (item.key === 'sword') receiveGear(winner, 'sword');
          else if (item.key === 'shield') receiveGear(winner, 'shield');
          else people[winner].food += 1;
          render();
        }));
        await wait(85);
      }
      await Promise.all(remPromises);
      await showStepCard(`【遺物表決結果】\n剩餘遺物（${remDesc}）全部歸 ${NAMES[winner]} 所有。`, '繼續');
    }

    return false;
  }

  // ---------- 插隊投票事件 1：生鏽鐵劍（情境化描述，不顯示冰冷百分比數字） ----------

  // ---------- 草藥投票事件（採藥歸來或意外發現，均為 1 株高恢復量草藥投票決定給誰用） ----------
  async function singleHerbVoteEvent(gathererId = null) {
    lastHerbGatherer = gathererId;
    await spawnPool(1, 'herb');

    const promptText = gathererId
      ? `【草藥】\n${NAMES[gathererId]} 帶回1株，須立即使用。\n投票給誰治傷？`
      : `【發現草藥】\n找到1株，須立即使用。\n投票給誰治傷？`;

    log('火堆旁放著唯一一株【草藥】，請投票決定給誰治療！');
    await runVoteSession(promptText, 'herb');
    const winner = await getSingleWinner('獲得了【草藥】');

    let healedAmt = 0;
    let hungerBonus = false;
    if (pool.length) {
      await flyPoolItem(takeFromPool(), $('slot-' + winner), () => {
        const beforeHp = people[winner].hp;
        people[winner].hp = Math.min(MAX, people[winner].hp + SINGLE_HERB_HEAL);
        healedAmt = people[winner].hp - beforeHp;
        if (healedAmt === 0) {
          people[winner].hunger = Math.min(MAX, people[winner].hunger + 6);
          hungerBonus = true;
        }
        render();
      });
    }

    lastHerbGatherer = null;
    if (hungerBonus) {
      await showStepCard(`【敷藥結果】\n${NAMES[winner]} 並未受傷，便將草藥的根莖嚼食充飢，飢餓度稍微獲得了緩解。`, '繼續');
    } else {
      await showStepCard(`【治療結果】\n${NAMES[winner]} 立即敷上了草藥，傷口止血癒合，生命恢復至 ${people[winner].hp}/${MAX}！`, '繼續');
    }
  }

  // ---------- 插隊投票事件 4：洞頂崩裂（狹窄空間一人主撐、眾人旁助）／追兵尾隨 ----------
  async function suddenHazardVoteEvent(kind) {
    const isCollapse = kind === 'collapse';
    currentIsCombat = !isCollapse;
    currentDangerPct = isCollapse ? 68 : 72;

    const cardPrompt = isCollapse
      ? '【洞頂崩裂】\n誰撐住木樁，讓其他人加固？\n重度危險 68%'
      : '【追兵逼近】\n誰繞路引開追兵，讓大家躲回洞穴？\n重度危險 72%';

    log(isCollapse ? '突發狀況：洞頂岩層崩裂！狹窄空間需選一人為主撐住木樁。' : '突發狀況：劫匪追兵尾隨！開始緊急投票。');
    await runVoteSession(cardPrompt, 'danger');
    const victim = await getSingleWinner(isCollapse ? '在狹窄處為主死命撐住木樁' : '去當誘餌引開追兵');

    await playCurtain(victim, isCollapse ? '主撐巨石中' : '誘敵斷後中');

    const selfSwords = isCollapse ? 0 : people[victim].swords;
    const selfShields = isCollapse ? 0 : people[victim].shields;

    const chanceCut = selfSwords * 0.02 + selfShields * 0.02;
    const dmgCut = selfSwords * 2 + selfShields * 3;
    const baseChance = currentDangerPct / 100;
    const u = Math.random();
    let msg = '';

    const collapseInjuries = [
      '在狹窄裂縫處死命主撐木樁、等待眾人從旁加固時，被崩落的稜角巨石砸中肩膀',
      '獨自頂在最窄的受力點支撐木樁時，被碎裂墜落的岩片割開額頭與手臂',
      '在狹窄空間全力死撐、讓大家得以在旁堆石加固時，因落石重壓扭傷腰背並吐血',
    ];
    const baitInjuries = [
      '繞路引開追兵時被荊棘劃傷後背',
      '在密林摸黑折返時跌倒撞傷手臂',
      '躲進石縫避開追兵時被尖石劃傷側腹',
    ];

    if (u < baseChance - chanceCut) {
      const raw = randInt(16, 20);
      const dmg = Math.max(1, raw - dmgCut);
      people[victim].hp = Math.max(0, people[victim].hp - dmg);
      const evList = isCollapse ? collapseInjuries : baitInjuries;
      const ev = evList[randInt(0, evList.length - 1)];
      msg = `${NAMES[victim]} ${ev}，損失 ${dmg} 點生命。`;
    } else if (u < baseChance && chanceCut > 0) {
      msg = `${NAMES[victim]} 驚險脫身，平安返回洞穴。`;
    } else {
      msg = isCollapse
        ? `${NAMES[victim]} 在狹窄處死命撐住木樁，配合其他人在旁迅速加固，驚險萬分地沒有受傷！`
        : `${NAMES[victim]} 驚險萬分地甩開了追兵，沒有受傷！`;
    }

    render();
    log(msg);
    await showStepCard('【突發狀況結果】\n' + msg, '繼續');
    await handleDeathsAndInheritance();
  }

  // ---------- 洞窟襲擊戰鬥結算（眾人一起防守可能有較好結果；鐵劍保護全隊、木盾僅護個人） ----------
  function doorRows() {
    const alive = aliveIds();
    const count = {};
    alive.forEach(id => { count[id] = 0; });
    alive.forEach(id => { if (votes[id]) count[votes[id]]++; });
    const levels = [...new Set(alive.map(id => count[id]))].sort((a, b) => b - a);
    return levels.map(n => alive.filter(id => count[id] === n));
  }

  function doorRisk(rowIdx, size, basePct, crowdChanceMod) {
    let delta;
    if (rowIdx === 0) delta = size === 1 ? +3 : size === 2 ? +2 : +1;
    else if (rowIdx === 1) delta = -2;
    else delta = -3;
    const damageDelta = rowIdx === 0 ? (size === 1 ? 2 : size === 2 ? 1 : 0) : rowIdx === 1 ? -1 : -2;
    return { chance: Math.min(0.96, Math.max(0.08, (basePct + delta + crowdChanceMod) / 100)), delta, damageDelta };
  }

  const ROW_NAMES = ['前排', '第二排', '第三排', '第四排', '第五排', '第六排'];

  async function doorBattle(plan, customEvents = null, customTitle = '【洞窟防禦戰報】') {
    const rows = doorRows();
    if (plan.workHunger) {
      const [wlo, whi] = plan.workHunger;
      rows[0].forEach(id => { workCost[id] = (workCost[id] || 0) + randInt(wlo, whi); });
    }
    log('迎戰站位：' + rows.map((r, i) => `${ROW_NAMES[i]} ${r.map(id => NAMES[id]).join('、')}`).join('；') + '。');

    rows.forEach((r, i) => r.forEach(id => {
      const t = $('tally-' + id);
      t.textContent = ROW_NAMES[i];
      t.classList.add('show');
    }));
    await wait(1350);

    const aliveCount = aliveIds().length;
    const crowdChanceMod = 3 - aliveCount;
    const crowdDmgReduction = aliveCount - 3;

    const hurt = [];
    const results = {};
    const totalTeamSwords = aliveIds().reduce((sum, id) => sum + people[id].swords, 0);
    const evList = customEvents || DOOR_EVENTS;

    rows.forEach((r, i) => r.forEach(id => {
      const { chance, damageDelta } = doorRisk(i, r.length, currentDangerPct, crowdChanceMod);
      const selfSwords = people[id].swords;
      const selfShields = people[id].shields;
      const otherTeamSwords = totalTeamSwords - selfSwords;
      const swordChanceCut = otherTeamSwords * 0.01 + selfSwords * 0.02;
      const shieldChanceCut = selfShields * 0.02;
      const totalChanceCut = swordChanceCut + shieldChanceCut;

      const u = Math.random();
      if (u < chance - totalChanceCut) {
        const raw = randInt(plan.dmgMin, plan.dmgMax) + damageDelta;
        const swordDmgCut = otherTeamSwords + selfSwords * 2;
        const shieldDmgCut = selfShields * 3;
        const cut = swordDmgCut + shieldDmgCut + crowdDmgReduction;
        const dmg = Math.max(1, raw - cut);
        const ev = evList[randInt(0, evList.length - 1)];
        people[id].hp = Math.max(0, people[id].hp - dmg);

        hurt.push(`${NAMES[id]} 在${ROW_NAMES[i]}${ev}，損失 ${dmg} 點生命。`);
        results[id] = { dmg, ev, row: i };
      } else if (u < chance && (totalChanceCut > 0 || crowdChanceMod < 0)) {
        hurt.push(`${NAMES[id]} 在${ROW_NAMES[i]}撐過襲擊，沒有受傷。`);
        results[id] = { dmg: 0, label: '撐住' };
      } else {
        hurt.push(`${NAMES[id]} 在${ROW_NAMES[i]}避開了襲擊，沒有受傷。`);
        results[id] = { dmg: 0, label: '閃避' };
      }
    }));

    render();
    if (hurt.length) hurt.forEach(h => log(h));

    // 戰報分頁：依站位由前排到後排，每頁 3 位，每人一句「在哪一排、為什麼受傷、損失多少」；最後一頁附座位總結格
    const anyHurt = Object.keys(results).some(id => results[id].dmg > 0);
    const grid = IDS.map(id => people[id].dead && !results[id] ? { id, value: '—', cls: 'off' }
      : results[id] && results[id].dmg > 0 ? { id, value: '−' + results[id].dmg, cls: 'hurt' }
      : { id, value: results[id] ? results[id].label : '—', cls: 'safe' });
    const pages = [];
    for (let i = 0; i < hurt.length; i += 3) pages.push(hurt.slice(i, i + 3));
    for (let i = 0; i < pages.length; i++) {
      const last = i === pages.length - 1;
      const tag = pages.length > 1 ? `（${i + 1}/${pages.length}）` : '';
      const note = (i === 0 && !anyHurt) ? '\n敵人被成功擋下，無人受傷！' : '';
      await showStepCard(`${customTitle}${tag}${note}\n` + pages[i].join('\n'),
        last ? '了解' : `看其餘 ${hurt.length - (i + 1) * 3} 位`, last ? grid : null);
    }
    IDS.forEach(id => {
      const t = $('tally-' + id);
      t.classList.remove('show');
      setPick(id, null);
    });
  }

  function decideEpilogueSpeech(id) {
    const def = EPILOGUE_LINES[getNpcBehavior(id)] || ['……再看看吧。', '……讓我歇一下。', 'stay'];
    const hurt = people[id].hp < 50;
    const choice = hurt ? 'stay' : def[2];
    const pool = EPILOGUE_NARRATION[hurt ? 'stay_hurt' : choice + '_ok'];
    const narration = pool[randInt(0, pool.length - 1)].replace('{n}', NAMES[id]);
    return { choice, line: `${narration}\n「${hurt ? def[1] : def[0]}」` };
  }
