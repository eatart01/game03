<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠征</title>
<style>
  :root {
    --bg: #2b241b;
    --panel: #3a3026;
    --ink: #e6d8bc;
    --muted: #ad9975;
    --btn: #8b6f47;
    --btn-hover: #a3865c;
    --hp: #b5604a;
    --hunger: #c9a050;
    --line: #5a4a36;
  }
  * { box-sizing: border-box; }
  canvas { image-rendering: pixelated; display: block; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: calc(24px + 20vh) 16px 24px;
    display: flex; justify-content: center;
  }

  .scene {
    width: 100%; max-width: 920px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 760px) {
    .scene { grid-template-columns: 1.5fr 1fr; align-items: start; }
  }

  /* ---------- 左：營火與隊伍 ---------- */
  .camp { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .fire { padding-top: 4px; }

  .fire-wrap { position: relative; display: flex; justify-content: center; }
  .gain {
    position: absolute; left: calc(50% + 84px); top: 38%;
    display: flex; align-items: center; gap: 6px;
    font-size: 20px; font-weight: 700; color: var(--hunger);
    opacity: 0; transform: translateY(6px);
    transition: opacity .4s, transform .4s;
    pointer-events: none;
  }
  .gain.show { opacity: 1; transform: none; }

  /* 窗簾（遠征中） */
  .curtain {
    position: absolute; inset: 0; z-index: 6;
    background: repeating-linear-gradient(90deg, #4a2f20 0 14px, #3a2418 14px 16px);
    border: 2px solid #2a1a10;
    transform: translateY(-101%);
    transition: transform 1.74s ease-in-out;
    display: flex; align-items: center; justify-content: center;
  }
  .curtain::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px;
    background: repeating-linear-gradient(90deg, var(--hunger) 0 6px, transparent 6px 12px);
  }
  .curtain.drop { transform: translateY(0); }
  /* 只裁切上方，下襬流蘇可以露出格子外 */
  .curtain-clip { position: absolute; inset: 0; clip-path: inset(0 -12px -16px -12px); z-index: 6; pointer-events: none; }
  .curtain span {
    color: var(--ink); font-size: 14px; font-weight: 700; letter-spacing: 3px;
    opacity: 0; transition: opacity .3s;
  }
  .curtain.shown span { opacity: 1; }

  .storage {
    position: relative;
    flex: 0 0 96px;
    background: var(--panel);
    border: 1px dashed var(--hunger);
    padding: 20px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .storage .count { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .flyer { position: fixed; pointer-events: none; z-index: 25; }
  .pile-wrap { position: absolute; left: 14px; top: 398px; width: 418px; height: 282px; z-index: 5; pointer-events: none; }
  .pile { position: relative; width: 100%; height: 100%; pointer-events: auto; }
  .pile canvas { position: absolute; }
  .pool { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; }
  .pool canvas { position: absolute; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.3); }
    to   { opacity: 1; transform: none; }
  }

  .dayLabel {
    position: fixed; left: 24px; top: 20px; z-index: 15;
    font-size: 26px; font-weight: 700; color: var(--hunger);
    letter-spacing: 2px; pointer-events: none;
  }
  .countdown {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 53px; font-weight: 700; color: #f2e6cc;
    text-shadow: 0 3px 0 #1e1811, 3px 0 0 #1e1811, -3px 0 0 #1e1811, 0 -3px 0 #1e1811;
    opacity: 0; pointer-events: none; z-index: 12;
    transition: opacity .2s;
  }
  .countdown.show { opacity: 1; }

  .party {
    margin-top: calc(5vh - 20px);
    display: flex; gap: 8px;
    justify-content: center;
    width: 100%;
    overflow-x: auto;
    position: relative;
    padding: 50px 4px 14px;
  }
  .slot {
    position: relative;
    flex: 0 0 92px;
    zoom: 1.1;
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 20px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .slot.me { border-color: var(--ink); }
  .slot.hover { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink); cursor: pointer; }
  .tag {
    position: absolute; top: 4px; left: 6px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  #eatIcons canvas { cursor: pointer; opacity: .3; transition: opacity .15s, transform .15s; }
  #eatIcons canvas.on { opacity: 1; }
  #eatIcons canvas:hover { transform: translateY(-3px); }
  .cname { font-size: 12px; font-weight: 700; color: var(--ink); min-height: 16px; line-height: 16px; letter-spacing: 1px; }
  .figure { height: 66px; display: flex; align-items: flex-end; }
  .stats-line { display: flex; flex-direction: column; gap: 4px; width: 100%; font-size: 12px; }
  .stat { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .stat .val { margin-left: auto; }
  .stat .lab { color: var(--muted); white-space: nowrap; }
  .eat {
    width: 100%; padding: 5px 0; border: none; cursor: pointer;
    background: var(--btn); color: var(--bg); font-family: inherit; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .eat:hover:not(:disabled) { background: var(--btn-hover); }
  .eat:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .eat:disabled canvas { opacity: .45; }

  /* 投票色塊（頭上方） */
  .pick {
    position: absolute; top: -46px; left: 50%; z-index: 7;
    width: 30px; height: 40px;
    transform: translateX(-50%);
    border: 2px solid var(--ink);
    display: none;
    font-size: 20px; font-weight: 700; line-height: 36px;
    color: var(--ink); text-align: center; overflow: hidden;
  }
  .pick.show { display: block; }

  /* 計票數字（角色頭頂） */
  .tally {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: var(--hunger); white-space: nowrap;
    opacity: 0; transition: opacity .3s; z-index: 3;
  }

  /* 平手抽牌 */
  .dcard {
    position: fixed; z-index: 30; width: 30px; height: 40px;
    border: 2px solid var(--ink); background: var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: var(--ink);
    pointer-events: none;
  }
  .tally.show { opacity: 1; }

  /* 最高票發亮 */
  .slot.win { border-color: var(--hunger); box-shadow: 0 0 0 3px var(--hunger); }

  /* 平手閃爍 */
  .slot.tie { animation: tieFlash .4s ease-in-out 3; }
  @keyframes tieFlash {
    50% { border-color: var(--hunger); box-shadow: 0 0 0 3px var(--hunger); }
  }

  .expedBtn {
    width: 100%; max-width: 360px; padding: 12px 0; border: none; cursor: pointer;
    background: var(--btn); color: var(--bg); font-size: 16px; font-family: inherit;
  }
  .expedBtn:hover:not(:disabled) { background: var(--btn-hover); }
  .expedBtn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- 右：卡牌與紀錄 ---------- */
  .side { margin-top: 5vh; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .deck-slot {
    background: var(--panel);
    border: 1px dashed var(--line);
    min-height: 150px;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .deck-slot .empty { color: var(--muted); font-size: 13px; }
  .card {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--ink);
    padding: 14px;
    font-size: 15px;
    line-height: 1.7;
    animation: slideIn .6s ease-out;
    white-space: pre-line;
  }
  @keyframes slideIn {
    from { transform: translateX(60px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .log {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 10px 12px;
    font-size: 14px;
    min-height: 160px;
    color: var(--muted);
    line-height: 1.6;
  }
  .log p { margin: 0; }

  /* 金幣圖示候選（暫時展示，左下） */
  .gallery {
    position: fixed; left: 12px; bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px;
    display: grid; grid-template-columns: repeat(5, auto); gap: 6px;
    z-index: 30;
  }
  .gallery-cell {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 4px 2px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .gallery-cell span { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 確認視窗（不遮擋背景） */
  .modal {
    position: fixed; inset: 0;
    background: none;
    pointer-events: none;
    display: none; align-items: center; justify-content: center;
    z-index: 20;
  }
  .modal.show { display: flex; }
  .modal-box {
    pointer-events: auto;
    background: var(--panel);
    border: 2px solid var(--ink);
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 14px;
    min-width: 220px;
    text-align: center;
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1; padding: 8px 0; border: none; cursor: pointer;
    background: var(--btn); color: var(--bg); font-family: inherit; font-size: 15px;
  }
  .modal-actions button.ghost { background: var(--line); color: var(--ink); }

  /* 懸浮說明 */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 3px 8px;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
  }

  /* ---------- 末日商人 ---------- */
  .shop { position: fixed; inset: 0; background: none; pointer-events: none; display: none; align-items: center; justify-content: center; z-index: 40; }
  .shop.show { display: flex; }
  .shop-box { pointer-events: auto; width: 1120px; max-width: 98vw; max-height: 96vh; background: var(--panel); border: 2px solid var(--ink); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .shop-head { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .shop-head b { font-size: 20px; letter-spacing: 2px; }
  .shop-say { color: var(--muted); font-size: 15px; min-height: 22px; line-height: 1.5; }
  .shop-grid { display: flex; gap: 8px; padding: 8px; background: var(--bg); border: 1px solid var(--line); width: max-content; }
  .cell { position: relative; width: 66px; height: 66px; background: #231c14; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .cell:hover { border-color: var(--ink); }
  .cell.sel { border-color: #e8c26a; box-shadow: inset 0 0 0 2px #e8c26a; }
  .cell.empty { cursor: default; opacity: .35; }
  .cell .price { position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #e8c26a; }
  .shop-bar { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--muted); }
  .shop-bar button { padding: 7px 22px; border: none; cursor: pointer; background: var(--btn); color: var(--bg); font-family: inherit; font-size: 15px; }
  .shop-bar button:hover { background: var(--btn-hover); }
  .eq-row { display: flex; gap: 12px; }
  .eq-panel { flex: 1; background: var(--bg); border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .eq-title { display: flex; justify-content: space-between; font-size: 14px; }
  .eq-grid { display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; justify-content: center; }
  .eq-bag { display: grid; grid-template-columns: repeat(6, 34px); gap: 3px; justify-content: center; }
  .eq-slot, .bag-slot { position: relative; background: #231c14; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6f5f48; }
  .eq-slot { width: 44px; height: 44px; }
  .bag-slot { width: 34px; height: 34px; }
  .eq-slot.has, .bag-slot.has { border-color: var(--muted); }
  .cell[data-tip]:hover::after, .eq-slot[data-tip]:hover::after, .bag-slot[data-tip]:hover::after { white-space: pre; z-index: 60; }
  .cell[data-tip]:hover::after { bottom: auto; top: calc(100% + 6px); left: 0; transform: none; }
  .auc { display: none; flex-direction: column; gap: 8px; padding: 10px; background: var(--bg); border: 1px solid #e8c26a; }
  .auc.show { display: flex; }
  .auc-top { font-size: 14px; color: #e8c26a; }
  .auc-cards { display: flex; gap: 14px; }
  .auc-card { width: 130px; padding: 8px 6px; text-align: center; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  .auc-face { margin-top: 6px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #231c14; border: 1px solid var(--line); color: var(--muted); }
  .auc-face.up { color: var(--ink); background: #3d3226; border-color: var(--ink); }
  .auc-face.ready { color: #7fa37a; font-size: 14px; }
  .auc-btns { display: flex; gap: 8px; }
  .auc-btns button { padding: 7px 16px; border: none; cursor: pointer; background: var(--btn); color: var(--bg); font-family: inherit; font-size: 14px; }
  .auc-btns button:disabled { opacity: .35; cursor: default; }
  .auc-btns button.ghost { background: var(--line); color: var(--ink); }
  .bag-slot.sell { border-color: #b5604a; box-shadow: inset 0 0 0 2px #b5604a; }
  .bag-slot.canSell { cursor: pointer; }
  .eq-sub { font-size: 11px; color: var(--muted); text-align: center; }
  .demo { position: fixed; inset: 0; background: rgba(20,15,10,.7); display: none; align-items: center; justify-content: center; z-index: 50; }
  .demo.show { display: flex; }
</style>
</head>
<body>
<div class="dayLabel" id="dayLabel">第1天</div>
<div class="scene">
  <div class="camp">
    <div class="fire-wrap">
      <canvas class="fire" id="fireCanvas"></canvas>
      <div class="countdown" id="countdown"></div>
      <div class="gain" id="gain"></div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="party" id="party">
      <div class="slot me" id="slot-p1">
        <span class="tag">P1</span>
        <span class="pick" id="pick-p1"></span>
        <span class="tally" id="tally-p1"></span>
        <div class="figure"><canvas id="ch-p1"></canvas></div>
        <div class="cname"></div>
        <div class="stats-line">
          <div class="stat"><span class="lab">生命</span><span class="val" id="hp-p1">100/100</span></div>
          <div class="stat"><span class="lab">飢餓</span><span class="val" id="hunger-p1">100/100</span></div>
          <div class="stat"><span class="lab">食物</span><span class="val" id="food-p1">0</span></div>
          <div class="stat"><span class="lab">金錢</span><span class="val" id="bread-p1">0</span></div>
        </div>
      </div>

      <div class="slot" id="slot-p2">
        <span class="tag">P2</span>
        <span class="pick" id="pick-p2"></span>
        <span class="tally" id="tally-p2"></span>
        <div class="figure"><canvas id="ch-p2"></canvas></div>
        <div class="cname">慈悲瑪莉</div>
        <div class="stats-line">
          <div class="stat"><span class="lab">生命</span><span class="val" id="hp-p2">100/100</span></div>
          <div class="stat"><span class="lab">飢餓</span><span class="val" id="hunger-p2">100/100</span></div>
          <div class="stat"><span class="lab">食物</span><span class="val" id="food-p2">0</span></div>
          <div class="stat"><span class="lab">金錢</span><span class="val" id="bread-p2">0</span></div>
        </div>
      </div>

      <div class="slot" id="slot-p3">
        <span class="tag">P3</span>
        <span class="pick" id="pick-p3"></span>
        <span class="tally" id="tally-p3"></span>
        <div class="figure"><canvas id="ch-p3"></canvas></div>
        <div class="cname">無賴卡爾</div>
        <div class="stats-line">
          <div class="stat"><span class="lab">生命</span><span class="val" id="hp-p3">100/100</span></div>
          <div class="stat"><span class="lab">飢餓</span><span class="val" id="hunger-p3">100/100</span></div>
          <div class="stat"><span class="lab">食物</span><span class="val" id="food-p3">0</span></div>
          <div class="stat"><span class="lab">金錢</span><span class="val" id="bread-p3">0</span></div>
        </div>
      </div>
    </div>
    <button class="expedBtn" id="expedBtn">迎接命運</button>
  </div>

  <div class="side">
    <div class="deck-slot" id="deckSlot"><span class="empty">末日，幾名勇者躲在洞窟裡…</span></div>
    <div class="log" id="log"><p>準備迎接命運。</p></div>
  </div>
</div>



<div class="pile-wrap" id="pileWrap" style="display:none"><div class="pile" id="pile" data-tip="共同基金 0"></div></div>
<div class="pile-wrap" id="pileWrap2" style="display:none"><div class="pile" id="pile2" data-tip="存糧 0"></div></div>

<div class="modal" id="eatModal" style="align-items:flex-end;padding-bottom:4vh">
  <div class="modal-box" style="min-width:300px">
    <div>要吃幾份食物？（點選圖示）</div>
    <div id="eatIcons" style="display:flex;gap:10px;justify-content:center"></div>
    <div id="eatInfo" style="font-size:13px;color:var(--muted)"></div>
    <div class="modal-actions">
      <button id="eatOk">確認</button>
      <button class="ghost" id="eatSkip">不吃</button>
    </div>
  </div>
</div>

<div class="modal" id="msgModal" style="align-items:flex-end;padding-bottom:4vh">
  <div class="modal-box" style="max-width:320px">
    <div id="msgText" style="line-height:1.7;white-space:pre-line"></div>
    <div class="modal-actions"><button id="msgClose">關閉</button></div>
  </div>
</div>


<div class="shop" id="shop">
  <div class="shop-box">
    <div class="shop-head"><b>末日商人</b><span class="shop-say" id="shopSay"></span></div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="auc" id="auc"><div class="auc-top" id="aucTop"></div><div class="auc-cards" id="aucCards"></div><div class="auc-btns" id="aucBtns"></div></div>
    <div class="shop-bar"><span id="shopInfo"></span><button id="shopOk">離開</button></div>
    <div class="eq-row" id="eqRow"></div>
  </div>
</div>
<div class="demo" id="demo">
  <div class="modal-box" style="min-width:320px">
    <div style="font-size:18px">DEMO 測試到此</div>
    <div style="color:var(--muted)">是否重新開始？</div>
    <div class="modal-actions"><button id="demoRestart">重新開始</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div id="modalText">確定投給？</div>
    <div class="modal-actions">
      <button id="modalOk">確定</button>
      <button class="ghost" id="modalCancel">取消</button>
    </div>
  </div>
</div>

<script>
  const MAX = 100;
  const HUNGER_COST = 11;
  const HUNGER_RESTORE = 7; // 每份食物恢復的飢餓
  const BREAD_MIN = 4;
  const BREAD_MAX = 20;
  const NPC_EAT_THRESHOLD = 50;
  const VOTE_MIN_MS = 1500;
  const VOTE_MAX_MS = 1500;

  // 每回合的題目；危險機率每回合在範圍內隨機抽一個，並顯示在題目上
  const SCENES = [
    p => `投票：今天派誰遠征？（${p}%重度危險）`,
    p => `投票：今天派誰採果？（${p}%輕度危險）`,
    p => `投票：有群怪物正在嘗試撬開洞穴的木門\n誰該站前排開戰？\n（看起來${p}%中度危險）`,
  ];
  const ROUND_TYPES = ['apple', 'berry', 'door'];
  // 被派出去工作的人，額外消耗的飢餓值（依危險等級）
  const WORK_HUNGER = {
    light: [11, 13], medium: [12, 14], heavy: [13, 16], extreme: [14, 19],
  };
  let workCost = {}; // 本回合各角色額外飢餓消耗
  let roundType = 'apple';

  // 危險等級對應的生命損失範圍
  const LEVEL = {
    light:   { min: 6,  max: 13 }, // 輕度
    medium:  { min: 14, max: 18 }, // 中度
    heavy:   { min: 19, max: 28 }, // 重度
    extreme: { min: 29, max: 39 }, // 極度
  };

  // 洞窟襲擊：依得票排站位，站位決定受傷機率與傷害修正
  const DOOR_EVENTS = [

  function drawSprite(canvas, rows, scale, overrides = {}) {
    const pal = { ...PAL, ...overrides };
    const w = Math.max(...rows.map(r => r.length));
    canvas.width = w * scale;
    canvas.height = rows.length * scale;
    const ctx = canvas.getContext('2d');
    rows.forEach((row, y) => {
      [...row].forEach((ch, x) => {
        if (ch === '.' || !pal[ch]) return;
        ctx.fillStyle = pal[ch];
        ctx.fillRect(x * scale, y * scale, scale, scale);
      });
    });
  }

  document.querySelectorAll('canvas[data-icon]').forEach(c => {
    drawSprite(c, SPRITES[c.dataset.icon], 2);
  });
  // ---------- 受傷血跡：生命越低，身上血跡像素越多（10 階段） ----------
  // 階段：生命 100 無血跡；90–99 為 1，每低 10 多一階，9 以下為 10
  const BLOOD_COUNTS = [0, 2, 5, 10, 16, 23, 31, 40, 50, 58, 64]; // 共 68 格身體像素，最後約 4 格不染血
  const BLOOD_COLORS = ['#a8322b', '#c0453a', '#8c2620'];
  function bloodStage(hp) {
    if (hp >= MAX) return 0;
    return Math.min(10, Math.floor((MAX - 1 - hp) / 10) + 1);
  }
  function seededOrder(seed, n) {
    let a = seed >>> 0;
    const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  const BODY_CELLS = [];
  SPRITES.char.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') BODY_CELLS.push([x, y]); }));
  const BLOOD_ORDER = { p1: seededOrder(11, BODY_CELLS.length), p2: seededOrder(22, BODY_CELLS.length), p3: seededOrder(33, BODY_CELLS.length) };
  const drawnStage = {};
  function drawCharacter(id) {
    const stage = bloodStage(people[id].hp);
    if (drawnStage[id] === stage) return;
    drawnStage[id] = stage;
    const cv = $('ch-' + id);
    drawSprite(cv, SPRITES.char, 5, { s: TUNIC[id], d: LEGS[id] });
    const ctx = cv.getContext('2d');
    BLOOD_ORDER[id].slice(0, BLOOD_COUNTS[stage]).forEach((idx, k) => {
      const [x, y] = BODY_CELLS[idx];
      ctx.fillStyle = BLOOD_COLORS[(x * 3 + y * 5 + k) % BLOOD_COLORS.length];
      ctx.fillRect(x * 5, y * 5, 5, 5);
    });
  }
  drawSprite($('fireCanvas'), SPRITES.fire, 15); // 靜態火堆

  // 角色名字顏色與服裝同色
  IDS.forEach(id => { const el = document.querySelector('#slot-' + id + ' .cname'); if (el && id !== 'p1') el.style.color = TUNIC[id]; });

  function render() {
    IDS.forEach(id => {
      const p = people[id];
      $('hp-' + id).textContent = `${p.hp}/${MAX}`;
      $('hunger-' + id).textContent = `${p.hunger}/${MAX}`;
      $('food-' + id).textContent = p.food;
      $('bread-' + id).textContent = p.bread;
      drawCharacter(id);
    });
    $('pile').dataset.tip = `共同基金 ${storage}`;
    $('pile2').dataset.tip = `存糧 ${foodStore}`;
  }

  function log(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    const box = $('log');
    box.insertBefore(p, box.firstChild);
    // 只保留最新 5 則
    while (box.children.length > 5) box.removeChild(box.lastChild);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // 每天開始：P2、P3 有食物就自動吃 1～3 份；P1（玩家）自己選吃幾份（最多 EAT_MAX 份）
  // 每份食物恢復 7 飢餓，只吃食物，不吃金幣
  const EAT_MAX = 3;
  function applyEat(id, n) {
    const p = people[id];
    if (n <= 0) return;
    p.food -= n;
    p.hunger = Math.min(MAX, p.hunger + HUNGER_RESTORE * n);
    log(`${NAMES[id]} 吃了 ${n} 份食物，飢餓度 +${HUNGER_RESTORE * n}。`);
  }

  // P1 選擇吃幾份：橫向食物圖示，點第 N 個 = 吃 N 份
  function pickEatCount(max) {
    return new Promise(resolve => {
      const box = $('eatIcons');
      box.innerHTML = '';
      let sel = Math.min(1, max);
      const icons = [];
      const refresh = () => {
        icons.forEach((c, i) => c.classList.toggle('on', i < sel));
        $('eatInfo').textContent = sel > 0
          ? `吃 ${sel} 份，飢餓度 +${HUNGER_RESTORE * sel}（目前 ${people.p1.hunger}/${MAX}）`
          : `不吃（目前 ${people.p1.hunger}/${MAX}）`;
      };
      for (let i = 1; i <= max; i++) {
        const c = document.createElement('canvas');
        drawSprite(c, SPRITES.berry, 5);
        c.addEventListener('click', () => { sel = (sel === i) ? i - 1 : i; refresh(); });
        box.appendChild(c);
        icons.push(c);
      }
      const done = n => {
        $('eatModal').classList.remove('show');
        $('eatOk').onclick = $('eatSkip').onclick = null;
        resolve(n);
      };
      $('eatOk').onclick = () => done(sel);
      $('eatSkip').onclick = () => done(0);
      refresh();
      $('eatModal').classList.add('show');
    });
  }

  async function dailyEat() {
    let ate = false;
    ['p2', 'p3'].forEach(id => {
      const p = people[id];
      if (p.food <= 0 || p.hunger >= MAX) return;
      applyEat(id, Math.min(p.food, randInt(1, EAT_MAX)));
      ate = true;
    });
    render();
    if (ate) await wait(800);
    const p1 = people.p1;
    if (p1.food > 0 && p1.hunger < MAX) {
      const n = await pickEatCount(Math.min(p1.food, EAT_MAX));
      if (n > 0) { applyEat('p1', n); ate = true; }
      render();
      await wait(500);

  // 金幣飛向緊急儲備區：左右各一半，從火堆飄出，落入儲備區後計數增加
  async function showFoodFly(n) {
    const fr = $('fireCanvas').getBoundingClientRect();
    const sr = $('storage').getBoundingClientRect();
    const cx = fr.left + fr.width / 2;
    const cy = fr.top + fr.height / 2;
    const tx = sr.left + sr.width / 2 - 8;
    const ty = sr.top + sr.height / 2 - 8;
    const half = Math.ceil(n / 2);
    const landings = [];
    for (let i = 0; i < n; i++) {
      const side = i < half ? -1 : 1;
      const sx = cx + side * (30 + Math.random() * 60) - 8;
      const sy = cy + (Math.random() * 60 - 30) - 8;
      const cv = document.createElement('canvas');
      drawSprite(cv, SPRITES[lootKey], 2);
      cv.className = 'flyer';
      cv.style.left = sx + 'px';
      cv.style.top = sy + 'px';
      document.body.appendChild(cv);
      const anim = cv.animate(
        [
          { transform: 'translate(0,0)', opacity: 0 },
          { transform: 'translate(0,0)', opacity: 1, offset: 0.2 },
          { transform: `translate(${tx - sx}px, ${ty - sy}px)`, opacity: 1 },
        ],
        { duration: 900, delay: i * 90, easing: 'ease-in', fill: 'forwards' }
      );
      landings.push(anim.finished.then(() => {
        cv.remove();
        storage += 1;
        render();
      }));
    }
    await Promise.all(landings);
    await wait(400);
  }

  // ---------- 金幣池與分配 ----------
  const pool = [];

  // 金幣圖示從火堆左右各一半飄出，留在火堆兩側等待分配
  async function spawnPool(n) {
    const box = $('pool');
    box.innerHTML = '';
    pool.length = 0;
    const half = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      const isLeft = i < half;
      const k = isLeft ? i : i - half;
      const col = Math.floor(k / 3), row = k % 3;
      const cv = document.createElement('canvas');
      drawSprite(cv, SPRITES[lootKey], 2);
      cv.style.left = (isLeft ? -(70 + col * 20) - 16 : 70 + col * 20) + 'px';
      cv.style.top = (6 + row * 22) + 'px';
      cv.style.animation = 'popIn .35s ease-out both';
      cv.style.animationDelay = (i * 40) + 'ms';
      box.appendChild(cv);
      pool.push(cv);
    }
    await wait(n * 40 + 450);
  }

  // 單一圖示飛向目標，落下時執行 onLand
  function flyIcon(srcIcon, targetEl, onLand) {
    const r = srcIcon.getBoundingClientRect();
    const t = targetEl.getBoundingClientRect();
    const cv = document.createElement('canvas');
    drawSprite(cv, SPRITES[lootKey], 2);
    cv.className = 'flyer';
    cv.style.left = r.left + 'px';
    cv.style.top = r.top + 'px';
    document.body.appendChild(cv);
    srcIcon.remove();
    const dx = t.left + t.width / 2 - 8 - r.left;
    const dy = t.top + t.height / 2 - 8 - r.top;
    const anim = cv.animate(
      [{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px, ${dy}px)` }],
      { duration: 550, easing: 'ease-in', fill: 'forwards' }
    );
    return anim.finished.then(() => { cv.remove(); onLand(); });
  }

  // 餅乾堆在地上：隨機落點，堆高時往左右與上方增加
  function addCookieToPile(pileId = 'pile', key = 'apple', count = storage) {
    const pile = $(pileId);
    const cv = document.createElement('canvas');
    drawSprite(cv, SPRITES[key], 2);
    const W = pile.clientWidth, H = pile.clientHeight;
    const x = (Math.random() + Math.random() - 1) * W * 0.36;
    const maxH = Math.min(34, 6 + count * 0.9);
    const y = 32 + Math.pow(Math.random(), 2) * maxH; // 木箱內部，由底部往上堆
    cv.style.left = (W / 2 + x - 8) + 'px';
    cv.style.bottom = y + 'px';
    pile.appendChild(cv);
  }

  // 餅乾堆區域：自動貼齊 P1 左側的空白區（與角色格同高）
  function layoutPile() {
    const s = $('slot-p1').getBoundingClientRect();
    const w = $('pileWrap');
    w.style.width = '88px';
    w.style.height = '88px';
    w.style.left = (s.left + window.scrollX - 88 - 6) + 'px';
    w.style.top = (s.bottom + window.scrollY - 88) + 'px';
    // 存糧木箱：放在金錢木箱正上方，留一點小間隔
    const w2 = $('pileWrap2');
    w2.style.width = '88px';
    w2.style.height = '88px';
    w2.style.left = w.style.left;
    w2.style.top = (s.bottom + window.scrollY - 88 - 88 - 4) + 'px';
  }

  function takeFromPool() {
    return pool.splice(randInt(0, pool.length - 1), 1)[0];
  }

  // 固定 n 份飛入共同基金
  async function sendToStorage(n) {
    const berry = lootKey === 'berry';
    $(berry ? 'pileWrap2' : 'pileWrap').style.display = '';
    layoutPile();
    const ps = [];
    for (let i = 0; i < n && pool.length; i++) {
      ps.push(flyIcon(takeFromPool(), $(berry ? 'pile2' : 'pile'), () => {
        if (berry) { foodStore += 1; addCookieToPile('pile2', 'berry', foodStore); }
        else { storage += 1; addCookieToPile(); }
        render();
      }));
      await wait(120);
    }
    await Promise.all(ps);
  }

  function checkDistDone() {
    if (distResolve && pool.length === 0 && pending === 0) {
      const r = distResolve;
      distResolve = null;
      r();
    }
  }

  // 從金幣池送一份給某人
  // target 為 'store' 時飛入共同箱子（木箱）
  function sendFromPool(target) {
    pending++;
    const toStore = target === 'store';
    const dest = toStore ? $(lootKey === 'berry' ? 'pile2' : 'pile') : $('slot-' + target);
    return flyIcon(takeFromPool(), dest, () => {
      if (toStore) {
        if (lootKey === 'berry') { foodStore += 1; addCookieToPile('pile2', 'berry', foodStore); }
        else { storage += 1; addCookieToPile(); }
      } else {
        people[target][lootKey === 'berry' ? 'food' : 'bread'] += 1;
      }
      render();
    }).then(() => { pending--; checkDistDone(); });
  }

  // P1 也可以把金幣額外分配到共同箱子
  $('pile').addEventListener('click', () => {
    if (phase !== 'distribute' || distLeader !== 'p1' || !pool.length || lootKey === 'berry') return;
    sendFromPool('store');
  });
  $('pile2').addEventListener('click', () => {
    if (phase !== 'distribute' || distLeader !== 'p1' || !pool.length || lootKey !== 'berry') return;
    sendFromPool('store');
  });

  // P1：點選角色，一次分一份，全部分完才結束
  IDS.forEach(target => {
    $('slot-' + target).addEventListener('click', e => {
      if (phase !== 'distribute' || distLeader !== 'p1' || !pool.length) return;
      if (e.target.closest('.eat')) return;
      sendFromPool(target);
    });
  });

  // P2／P3：8～10 秒分完，分批、快慢不一，中間有停頓與假猶豫
  // 依 NPC 個性決定分配：回傳 { p1, p2, p3 } 各拿幾份
  function planNpc(leader, total) {
    const others = IDS.filter(id => id !== leader);
    const alloc = { p1: 0, p2: 0, p3: 0 };
    let mine;
    if (leader === 'p2') {
      // 慈悲瑪莉：50% 一個都不拿；否則只拿 1～2 個
      mine = Math.random() < 0.5 ? 0 : Math.min(total, randInt(1, 2));
    } else {
      // 無賴卡爾：一定先分給自己 2～3 個
      mine = Math.min(total, randInt(2, 3));
    }
    alloc[leader] = mine;
    let rest = total - mine;
    // 其餘盡量均分給其他人；除不盡的那一份隨機給其中一人
    const first = Math.random() < 0.5 ? 0 : 1;
    others.forEach((id, i) => {
      alloc[id] = Math.floor(rest / others.length);
    });
    for (let k = 0; k < rest % others.length; k++) alloc[others[(first + k) % others.length]]++;
    return alloc;
  }

  async function distributeNpc() {
    const alloc = planNpc(distLeader, pool.length);
    const chunks = IDS.filter(id => alloc[id] > 0).map(id => [id, alloc[id]]);
    for (let i = chunks.length - 1; i > 0; i--) { const j = randInt(0, i); [chunks[i], chunks[j]] = [chunks[j], chunks[i]]; }
    // 無賴卡爾：分配過程中先把自己的份拿走，剩下才分給其他人
    if (distLeader === 'p3') chunks.sort((a, b) => (b[0] === 'p3') - (a[0] === 'p3'));
    const GAP = 140;
    const total = 3000;
    const pauseBudget = Math.max(0, total - pool.length * GAP);
    const slots = chunks.length - 1;
    const weights = Array.from({ length: Math.max(slots, 0) }, () => 0.4 + Math.random() * 2.2);
    const sumW = weights.reduce((a, b) => a + b, 0) || 1;

    const result = { p1: 0, p2: 0, p3: 0, store: 0 };
    const ps = [];
    for (let i = 0; i < chunks.length; i++) {
      const [t, c] = chunks[i];
      for (let k = 0; k < c; k++) {
        ps.push(sendFromPool(t));
        result[t]++;
        await wait(GAP);
      }
      if (i < slots) await wait(Math.max(450, pauseBudget * weights[i] / sumW));
    }
    await Promise.all(ps);
    return result;
  }

  // 平手抽牌：所有人頭上的色塊蓋成土色 → 飛到火堆下方疊成一疊並洗牌 → 倒數 3 2 1 → 抽出一張往右翻開
  async function drawCard(tied) {
    // 疊牌位置：火堆下方、P2 格子上方（中心點）
    const p2 = $('slot-p2').getBoundingClientRect();
    const cx = p2.left + p2.width / 2;
    const cy = $('fireCanvas').getBoundingClientRect().bottom + 6 + 20; // 緊貼火堆底座下方
    const W = 30, H = 40;

    // 先把頭上色塊蓋成土色，再換成實體卡片
    IDS.forEach(id => setDone(id));
    $('pick-p1').textContent = '?';
    await wait(500);

    const cards = IDS.map(id => {
      const r = $('pick-' + id).getBoundingClientRect();
      const c = document.createElement('div');
      c.className = 'dcard';
      c.textContent = '?';
      c.style.left = (r.left + r.width / 2 - W / 2) + 'px';
      c.style.top = (r.top + r.height / 2 - H / 2) + 'px';
      c.style.transform = 'scale(1)';
      document.body.appendChild(c);
      return { id, el: c };
    });
    IDS.forEach(id => setPick(id, null));

    // 飛到疊牌位置，輕微錯位像是蓋起來的一疊
    await Promise.all(cards.map((c, i) => {
      const from = c.el.getBoundingClientRect();
      const dx = cx - W / 2 - parseFloat(c.el.style.left);
      const dy = cy - H / 2 - parseFloat(c.el.style.top);
      return c.el.animate(
        [{ transform: 'translate(0,0) scale(1)' },
         { transform: `translate(${dx}px, ${dy}px) scale(1)` }],
        { duration: 700, easing: 'ease-in-out', fill: 'forwards', delay: i * 80 }
      ).finished;
    }));

    // 輕微洗牌：每張左右小幅交錯位移、微轉
    const base = c => {
      const dx = cx - W / 2 - parseFloat(c.el.style.left);
      const dy = cy - H / 2 - parseFloat(c.el.style.top);
      return { dx, dy };
    };
    for (let round = 0; round < 4; round++) {
      await Promise.all(cards.map(c => {
        const { dx, dy } = base(c);
        const ox = randInt(-14, 14), oy = randInt(-5, 5), rot = randInt(-8, 8);
        return c.el.animate(
          [{ transform: `translate(${dx}px, ${dy}px)` },
           { transform: `translate(${dx + ox}px, ${dy + oy}px) rotate(${rot}deg)`, offset: 0.5 },
           { transform: `translate(${dx}px, ${dy}px)` }],
          { duration: 320, easing: 'ease-in-out' }
        ).finished;
      }));
    }
    // 定位在疊牌位置（固定，之後以 left/top 控制）
    cards.forEach(c => {
      const { dx, dy } = base(c);
      c.el.getAnimations().forEach(a => a.cancel());
      c.el.style.left = (parseFloat(c.el.style.left) + dx) + 'px';
      c.el.style.top = (parseFloat(c.el.style.top) + dy) + 'px';
      c.el.style.transform = 'none';
    });

    // 從「平手角色得到的票」中抽出一張，放到最上面
    const pool = cards.filter(c => tied.includes(votes[c.id]));
    const drawn = pool[randInt(0, pool.length - 1)];
    document.body.appendChild(drawn.el);

    // 倒數 3 2 1：數字顯示在最上面那張牌上
    for (const n of [2, 1]) {
      drawn.el.textContent = n;
      await wait(800);
    }
    drawn.el.textContent = '?';
    await wait(300);

    // 往右移出一張
    await drawn.el.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(70px)' }],
      { duration: 500, easing: 'ease-out', fill: 'forwards' }
    ).finished;
    drawn.el.style.transform = 'translateX(70px)';
    drawn.el.getAnimations().forEach(a => a.cancel());
    await wait(300);

    // 翻開：橫向壓扁 → 換成該顏色 → 展開
    await drawn.el.animate(
      [{ transform: 'translateX(70px) scaleX(1)' }, { transform: 'translateX(70px) scaleX(0)' }],
      { duration: 220, easing: 'ease-in', fill: 'forwards' }
    ).finished;
    const winner = votes[drawn.id];
    drawn.el.textContent = '';
    drawn.el.style.background = TUNIC[winner];
    await drawn.el.animate(
      [{ transform: 'translateX(70px) scaleX(0)' }, { transform: 'translateX(70px) scaleX(1)' }],
      { duration: 220, easing: 'ease-out', fill: 'forwards' }
    ).finished;

    // 公布：被抽中的角色格發亮
    $('slot-' + winner).classList.add('win');
    await wait(1500);
    $('slot-' + winner).classList.remove('win');
    cards.forEach(c => c.el.remove());
    return winner;
  }

  // 競標：每輪各自蓋牌出價（放棄／持平／+1／+2／+3），同時翻牌
  function bidLabel(price, v) { return v === null ? '放棄' : (v === price ? '持平' : '+' + (v - price)); }
  function npcBid(id, price) {
    const coins = people[id].bread, room = Math.min(3, coins - price);
    if (coins < price) return null;
    if (id === 'p3') { // 無賴卡爾：積極加價
      if (Math.random() < 0.1) return null;
      return price + randInt(room >= 1 ? 1 : 0, Math.max(room, 0));
    }
    if (Math.random() < 0.4) return null; // 慈悲瑪莉：常常退讓
    return price + (room >= 1 && Math.random() < 0.4 ? 1 : 0);
  }
  function playerBid(price) {
    return new Promise(res => {
      const box = $('aucBtns'); box.innerHTML = '';
      const coins = people.p1.bread;
      [[null, '放棄'], [price, '持平'], [price + 1, '+1'], [price + 2, '+2'], [price + 3, '+3']].forEach(([v, lab]) => {
        const bt = document.createElement('button');
        bt.textContent = v === null || v === price ? lab : `${lab}（${v}）`;
        if (v === price) bt.textContent = `持平（${v}）`;
        if (v === null) bt.className = 'ghost';
        if (v !== null && v > coins) bt.disabled = true;
        bt.onclick = () => { box.innerHTML = ''; res(v); };
        box.appendChild(bt);
      });
    });
  }
  async function auction(key, ids) {
    const it = ITEMS[key], e = stock.find(x => x.key === key && !x.sold);
    let price = it.price, active = [...ids], round = 1;
    $('auc').classList.add('show');
    log(`${it.name}有 ${ids.map(i => NAMES[i]).join('、')} 同時想要，進入競標。`);
    const end = () => { $('aucBtns').innerHTML = ''; $('auc').classList.remove('show'); };
    while (true) {
      active = active.filter(id => people[id].bread >= price);
      $('aucTop').textContent = `競標：${it.name}　第 ${round} 輪　目前價 ${price} 金幣`;
      $('aucBtns').innerHTML = '';
      const cards = {};
      $('aucCards').innerHTML = '';
      active.forEach(id => {
        const c = document.createElement('div'); c.className = 'auc-card';
        c.innerHTML = `<div style="color:${id === 'p1' ? 'var(--ink)' : TUNIC[id]}">${NAMES[id]}</div><div class="auc-face">？</div>`;
        $('aucCards').appendChild(c); cards[id] = c.querySelector('.auc-face');
      });
      if (!active.length) { say(pickFrom(LINE_CONFUSED)); log('沒有人出得起價，商人一臉困惑。'); await wait(1800); end(); return; }
      say(round === 1 ? '想要的人，把牌蓋好。' : '平手！再來一輪。');
      const bids = {};
      for (const id of active) {
        if (id === 'p1') { bids[id] = await playerBid(price); cards[id].textContent = '已出牌'; cards[id].className = 'auc-face ready'; }
        else { await wait(500); bids[id] = npcBid(id, price); cards[id].textContent = '已出牌'; cards[id].className = 'auc-face ready'; }
      }
      await wait(700);
      for (const id of active) { cards[id].textContent = bids[id] === null ? '放棄' : `${bids[id]} 金`; cards[id].className = 'auc-face up'; await wait(450); }
      await wait(900);
      const live = active.filter(id => bids[id] !== null);
      if (!live.length) { say(pickFrom(LINE_CONFUSED)); log(`所有人都放棄了${it.name}，商人一臉困惑。`); await wait(1800); end(); return; }
      const max = Math.max(...live.map(id => bids[id]));
      const top = live.filter(id => bids[id] === max);
      if (top.length === 1) {
        const w = top[0];
        log(`${NAMES[w]} 以 ${max} 金幣標下${it.name}。`);
        buyItem(w, e, max);
        say(`${NAMES[w]}，成交。`); renderShop(); renderEquip(); await wait(1500); end(); return;
      }
      log(`${top.map(i => NAMES[i]).join('、')} 同出 ${max} 金幣，平手。`);
      if (top.every(id => people[id].bread <= max)) {
        say(pickFrom(LINE_REFUSE)); log(`平手且無人能再加價，商人拒絕出售${it.name}。`);
        await wait(2000); end(); return;
      }
      active = top; price = max; round++;
    }
  }

  // ---------- 裝備對危險的隱藏效果（事件發生時才抽） ----------
  function rollTeamWeapons(ids) {
    let pct = 0; const parts = [];
    ids.forEach(id => {
      const w = gear[id].equip.weapon;
      if (w) { pct += randInt(w.pctLo, w.pctHi); parts.push({ text: `${NAMES[id]}的${w.name}`, shield: false }); }
    });
    return { pct, parts };
  }
  function rollShield(id) {
    const sh = gear[id].equip.offhand;
    if (!sh) return { pct: 0, parts: [] };
    return { pct: randInt(sh.pctLo, sh.pctHi), parts: [{ text: `${NAMES[id]}的${sh.name}`, shield: true }] };
  }
  function cutDamage(raw, parts) {
    const base = Math.max(1, raw), dmg = Math.max(1, raw - parts.length);
    let red = base - dmg; const notes = [];
    parts.forEach(p => { if (red > 0) { notes.push(p.shield ? `${p.text}擋下了 1 點傷害。` : `${p.text}讓傷害減少了 1 點。`); red--; } });
    return { dmg, notes };
  }

  async function doorBattle() {
    const rows = doorRows();
    const [wlo, whi] = WORK_HUNGER.medium;
    rows[0].forEach(id => { workCost[id] = randInt(wlo, whi); }); // 前排視為被派出去的人
    log('站位：' + rows.map((r, i) => `${ROW_NAMES[i]} ${r.map(id => NAMES[id]).join('、')}`).join('；') + '。');
    rows.forEach((r, i) => r.forEach(id => {
      const t = $('tally-' + id);
      t.textContent = ROW_NAMES[i];
      t.style.fontSize = '13px';
      t.classList.add('show');
    }));
    await wait(1800);

    const hurt = [];
    const tw = rollTeamWeapons(IDS);
    rows.forEach((r, i) => r.forEach(id => {
      const { chance, delta } = doorRisk(i, r.length);
      const sh = rollShield(id);
      const u = Math.random();
      if (u < chance - (tw.pct + sh.pct) / 100) {
        const raw = randInt(DOOR_DMG_MIN, DOOR_DMG_MAX) + delta;
        const { dmg, notes } = cutDamage(raw, [...sh.parts, ...tw.parts]);
        const ev = DOOR_EVENTS[randInt(0, DOOR_EVENTS.length - 1)];
        people[id].hp = Math.max(0, people[id].hp - dmg);
        hurt.push(`${NAMES[id]} 在洞口迎戰時${ev}，損失 ${dmg} 點生命。` + notes.join(''));
      } else if (u < chance && (tw.pct + sh.pct) > 0) {
        hurt.push(`${NAMES[id]} 憑著裝備化解了一次危險。`);
      }
    }));
    render();
    if (hurt.length) hurt.forEach(h => log(h)); else log('怪物被擋了下來，沒有人受傷。');
    await showMsg('【戰報】\n' + (hurt.length ? hurt.join('\n') : '怪物被擋了下來，沒有人受傷。'), '了解');
    IDS.forEach(id => { const t = $('tally-' + id); t.classList.remove('show'); t.style.fontSize = ''; });
  }
