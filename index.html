    currentIsCombat = true;
    await runVoteSession(
      `【最終決戰・第二波】精銳護衛衝來，誰該靠前迎戰？\n極度危險 ${currentDangerPct}%`,
      'danger'
    );
    await doorBattle({ dmgMin: 21, dmgMax: 27, workHunger: [5, 7] }, BOSS_WAVE_2_EVENTS, '【第二波：擊潰統領護衛軍】');
    if ((await handleDeathsAndInheritance()) || people.p1.dead) { showEnding(true); return; }

    // 第三波：驕傲的叛軍統領覺得有趣，要大家一起上
    await shake();
    currentDangerPct = randInt(82, 90);
    currentIsCombat = true;
    await runVoteSession(
      `【最終決戰・第三波】叛軍統領親自出手，誰該靠前迎戰？\n毀滅級危險 ${currentDangerPct}%`,
      'danger'
    );
    await doorBattle({ dmgMin: 25, dmgMax: 33, workHunger: [6, 8] }, BOSS_WAVE_3_EVENTS, '【第三波：圍攻叛軍統領】');
    if ((await handleDeathsAndInheritance()) || people.p1.dead) { showEnding(true); return; }

    // 奇蹟擊倒統領與受脅迫正規軍反戈劇情
    log('奇蹟般擊倒叛軍統領！洞外受脅迫的王國正規軍當場調轉刀槍擊潰劫匪！');
    await showStepCard(
      '【奇蹟逆轉・王國正規軍反戈！】\n' +
      '在眾人拼死圍攻之下，原本勝券在握、不可一世的叛軍統領，竟意外被你們抓準破綻，奇蹟般地重傷倒地斃命！\n\n' +
      '洞外原本受到高壓脅迫而屈服的王國正規軍士兵見統領斃命，當場調轉刀槍，將周圍殘存的劫匪士兵全數擊倒，並決定將這道捷報傳回各地，號召全軍反攻平亂！',
      '進入最後的去留表態'
    );

    // 進行最後的個人去留表態（依序發言 ➔ 最後輪到 P1 ➔ THE END）
    await runFinalEpilogueVote();
  }

  // ---------- 檢查是否遊戲失敗 ----------
  function showEnding(isGameOver = false) {
    const alive = aliveIds();
    const titleEl = $('endTitle');
    const descEl = $('endDesc');

    if (isGameOver || people.p1.dead) {
      titleEl.textContent = '【結局：命喪亂世】';
      titleEl.style.color = 'var(--hp)';
      descEl.textContent = `你在第 ${day} 天倒下了。\n在這場殘酷的逃難與慢性消耗戰中，飢餓、傷痛與人性的取捨吞噬了你。\n\n目前存活者（${alive.length}人）：${alive.length ? alive.map(id => NAMES[id]).join('、') : '全軍覆沒'}`;
    renderProse(descEl, descEl.textContent);

      $('demo').classList.add('show');
    }
  }

  // ---------- 每日主流程 ----------
  async function playDay() {
    hideCornerHint();
    phase = 'eating';
    $('expedBtn').disabled = true;
    if (day > 1) await dailyEat();

    currentPlan = DAY_PLANS[day - 1];
    workCost = {};

    // 第 30 天進入三波叛軍統領決戰與終局去留表態
    if (currentPlan.type === 'final_boss' || day === TOTAL_DAYS) {
      await playDay30BossSequence();
      return;
    }

    currentDangerPct = randInt(currentPlan.lo, currentPlan.hi);
    currentIsCombat = currentPlan.combat !== false;

    // 若是洞窟襲擊日，播放震動特效
    if (currentPlan.type === 'door') {
      const hit = (x, y) => ({ transform: `translate(${x}px, ${y}px)` });
      const kf = [hit(0, 0), hit(-4, 2), hit(4, -2), hit(-2, 0), hit(0, 0)];
      const sc = document.querySelector('.scene');
      for (let i = 0; i < 3; i++) {
        await sc.animate(kf, { duration: 220, easing: 'ease-out' }).finished;
        await wait(i < 2 ? 160 : 0);
      }
      await wait(200);
    }

    // 進行當日主投票
    await runVoteSession(currentPlan.prompt(currentDangerPct), 'danger');

    if (currentPlan.type === 'door') {
      await doorBattle(currentPlan);
      const gameOver = await handleDeathsAndInheritance();
      if (gameOver || people.p1.dead) { showEnding(true); return; }

      if (currentPlan.afterEvent === 'sword' && aliveIds().length > 0) {
        await rustySwordVoteEvent();
      } else if (currentPlan.afterEvent === 'shield' && aliveIds().length > 0) {
        await rottenShieldVoteEvent();
      }
    } else {
      // 單人外出（採果／遠征／採草藥）
      const leader = await getSingleWinner('被選中外出');
      await wait(420);
      await playCurtain(leader, currentPlan.curtainText);

      const selfSwords = currentIsCombat ? people[leader].swords : 0;
      const selfShields = currentIsCombat ? people[leader].shields : 0;

      const chanceCut = selfSwords * 0.02 + selfShields * 0.02;
      const dmgCut = selfSwords * 2 + selfShields * 3;
      const u = Math.random();
      const chance = currentDangerPct / 100;
      const evPool = currentPlan.injuries;
      let msg = null;

      if (u < chance - chanceCut) {
        const raw = randInt(currentPlan.dmgMin, currentPlan.dmgMax);
        const dmg = Math.max(1, raw - dmgCut);
        const ev = evPool[randInt(0, evPool.length - 1)];
        people[leader].hp = Math.max(0, people[leader].hp - dmg);
        msg = `${NAMES[leader]} ${currentPlan.verb}${ev}，損失 ${dmg} 點生命。`;
      } else if (u < chance && chanceCut > 0) {
        msg = `${NAMES[leader]} ${currentPlan.verb}驚險避開危險，平安歸來。`;
      } else {
        msg = `${NAMES[leader]} ${currentPlan.verb}順利避開危險，平安歸來，沒有受傷。`;
      }

      render();
      log(msg);
      await showStepCard('【外出戰報】\n' + msg, '了解');

      const diedOutside = people[leader].hp <= 0;
      const gameOver = await handleDeathsAndInheritance();
      if (gameOver || people.p1.dead) { showEnding(true); return; }

      const isHerbGather = currentPlan.type === 'herb_gather';

      if (!diedOutside && !people[leader].dead) {
        const [wlo, whi] = currentPlan.workHunger;
        workCost[leader] = randInt(wlo, whi);

        if (currentPlan.day === 2) {
          await showStepCard(`【尋水結果】\n${NAMES[leader]} 找到洞穴附近安全的水源，並採集了一些野果。`, '繼續');
        }

        if (isHerbGather) {
          // 採草藥日程：只帶回唯一 1 株草藥，直接進入全員投票決定給誰敷用
          await singleHerbVoteEvent(leader);
        } else {
          // 採集／尋糧：實際帶回 4～7 份食物，由外出者分配
          const gained = randInt(4, 7);
          const tl = $('tally-' + leader);
          tl.textContent = '分配中';
          tl.classList.add('show');

          log(`${NAMES[leader]} 帶回 ${gained} 份食物`);
          await spawnPool(gained, 'berry');

          if (leader === 'p1') {
            distLeader = 'p1';
            phase = 'distribute';
            showCard(`【分配收穫】\n你實際帶回了 ${gained} 份食物！\n請直接「點選角色卡片」全部分配完畢。`);
            $('expedBtn').textContent = '請點選角色卡片進行分配';
            $('expedBtn').disabled = true;
            await new Promise(res => { distResolve = res; checkDistDone(); });
            phase = 'resolve';
          } else {
            distLeader = leader;
            showCard(`【分配收穫】\n${NAMES[leader]} 正在分配實際帶回的 ${gained} 份食物…`);
            const r = await distributeNpcFood();
            const summary = aliveIds().filter(id => r[id] > 0).map(id => `${NAMES[id]}+${r[id]}`).join('、');
            log(`${NAMES[leader]} 分配完畢：${summary}。`);
          }
          tl.classList.remove('show');
        }
      } else {
        await showStepCard(`【收穫遺失】\n由於 ${NAMES[leader]} 在外頭不幸陣亡，今天沒有帶回任何${isHerbGather ? '草藥' : '食物'}……`, '繼續');
      }

      // 檢查是否有當日插隊投票事件（意外發現草藥／崩裂／誘餌）
      if (aliveIds().length > 0 && !people.p1.dead) {
        if (currentPlan.afterEvent === 'potent_herb') {
          await singleHerbVoteEvent(null);
        } else if (currentPlan.afterEvent === 'collapse' || currentPlan.afterEvent === 'bait') {
          await suddenHazardVoteEvent(currentPlan.afterEvent);
          if (people.p1.dead) { showEnding(true); return; }
        }
      }
    }

    // 回合結束：扣除飢餓與飢餓見底傷害
    await endRound();
  }

  async function endRound() {
    const starveNotes = [];
    const starved = new Set();

    const extras = [];
    aliveIds().forEach(id => {
      const extra = workCost[id] || 0;
      people[id].hunger = Math.max(0, people[id].hunger - HUNGER_COST - extra);
      if (extra > 0) extras.push(`${NAMES[id]} 勞累再 −${extra}`);

      // 飢餓見底扣血
      if (people[id].hunger === 0) {
        starved.add(id);
        people[id].hp = Math.max(0, people[id].hp - STARVE_DMG);
        starveNotes.push(NAMES[id]);
      }
    });

    log(`夜幕降臨：全員飢餓 −${HUNGER_COST}` + (extras.length ? '；' + extras.join('、') : ''));
    if (starveNotes.length) log(`${starveNotes.join('、')} 飢餓見底，生命 −${STARVE_DMG}`);
    render();

    if (starveNotes.length) {
      await showStepCard(`【飢寒交迫】\n糧袋見底，飢餓的人體力衰竭，各損失 ${STARVE_DMG} 點生命。`, '繼續',
        IDS.map(id => starved.has(id) ? { id, value: '−' + STARVE_DMG, cls: 'hurt' } : { id, value: people[id].dead ? '—' : '撐住', cls: people[id].dead ? 'off' : 'safe' }));
    }

    const gameOver = await handleDeathsAndInheritance();
    if (gameOver || people.p1.dead) { showEnding(true); return; }

    await wait(350);
    IDS.forEach(id => setPick(id, null));
    day++;
    render();
    showCard(`第 ${day - 1} 天結束了。\n點擊下方按鈕迎接第 ${day} 天的命運。`);
    $('expedBtn').textContent = `迎接命運（前進第${day}天）`;
    phase = 'idle';
    $('expedBtn').disabled = false;
  }

  $('expedBtn').addEventListener('click', () => {
    if (phase === 'step' && stepResolve) {
      const r = stepResolve;
      stepResolve = null;
      r();
      return;
    }
    if (phase === 'idle') {
      playDay();
    }
  });

  $('demoRestart').addEventListener('click', () => {
    day = 1;
    initRoster();
    IDS.forEach(id => {
      setPick(id, null);
      $('tally-' + id).classList.remove('show');
    });
    logEntries.length = 0; logPage = 0; logPages = [];
    log('重新開始。已隨機抽選本局的同伴並打散座位順序。');
    showCard('叛國軍閥勾結上萬名劫匪，深夜挖通地道突襲王城，控制了國王與王室。\n國家瞬間陷入混亂，6 名逃難者倉皇躲進深山洞窟，只能靠「投票」決定誰冒死外出採糧採藥、物資又該如何分配。\n\n洞外不時傳來搜山隊的腳步聲，洞內存糧一天比一天少。出去的人可能帶回生機，也可能帶傷而歸。沒有人能永遠置身事外，每一次投票，都牽動著六人的命運。');
    $('expedBtn').textContent = '迎接命運（開始第1天）';
    $('expedBtn').disabled = false;
    $('demo').classList.remove('show');
    phase = 'idle';
    render();
  });

  [...$('log').querySelectorAll('p')].forEach(el => logEntries.push({ id: ++logSequence, text: el.textContent }));
  renderLog(true);
  const opening = document.querySelector('#deckSlot .empty');
  if (opening) {
    const openingText = opening.innerHTML.replace(/<br\s*\/?\s*>/gi, '\n');
    const decoded = document.createElement('div');
    decoded.innerHTML = openingText;
    renderProse(opening, decoded.textContent);

  }
  $('modalDock').append($('eatModal'), $('modal'));
  if (START_MOBILE) document.body.classList.add('mobile-mode');
  initRoster();
  log(TITLED ? '【系統】已開啟頭銜：名字帶稱號，性格跟著名字走。連按 3 次 P2 可關閉。' : '【系統】頭銜已關閉：名字單純，性格隨機配對。連按 3 次 P2 可開啟頭銜。');
  render();
  fitDesktop();
  reflowReadingPages();
</script>
</body>
</html>
